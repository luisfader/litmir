<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кто ты в «Звёздном романе»?</title><style>body{margin:0;background:#101b30;color:#f6f0e6;font:17px/1.6 system-ui}main{max-width:740px;margin:auto;padding:30px 20px 70px}h1{font:2.4rem Georgia;color:#f8db99}.card{background:#1b2b43;border:1px solid #4a5c76;border-radius:18px;padding:22px;margin:18px 0}label{display:block;padding:12px;border:1px solid #53647b;border-radius:10px;margin:9px 0;cursor:pointer}label:has(input:checked){background:#31516e;border-color:#f3d49b}input{margin-right:12px;accent-color:#f4d394}button{background:#f3d49b;color:#14243c;border:0;border-radius:10px;padding:14px 22px;font-size:17px;font-weight:bold;cursor:pointer}#result{display:none;border:2px solid #f3d49b}a{color:#f3d49b}p{color:#c9d6e5}</style><main><a href="../../index.html#/zvezdnyj-roman">← К роману</a><h1>Кто ты в мире «Звёздного романа»?</h1><p>Литературный тест личности: шесть ситуаций без правильных и неправильных ответов.</p><div id="questions"></div><button id="check">Узнать результат</button><p id="error" role="alert"></p><section class="card" id="result" aria-live="polite"></section><p><small>Развлекательный тест, не психологическая диагностика.</small></p></main><script>const questions=[["Когда перед тобой неизвестность, ты…",["Иду вперёд, даже если боюсь","Сначала изучаю опасность","Ищу нестандартное решение"]],["Что для тебя значит доверие?",["Смелость открыться","Обещание защищать близких","Способ объединить разные взгляды"]],["Если друг оказался в беде, ты…",["Рискую собой","Продумываю спасение","Объединяю всех помощников"]],["Что ты ценишь больше всего?",["Свободу выбора","Верность","Равновесие"]],["Когда прошлое меняет твою жизнь, ты…",["Принимаю перемены","Защищаю дорогое","Примиряю прошлое и будущее"]],["В споре ты чаще…",["Говорю о чувствах","Предлагаю план","Ищу общую позицию"]]];const names=["Лаура","Лусиано","Сердце Мира"];const descriptions=["Ты похож на Лауру: любознательность, смелость и способность любить помогают тебе идти навстречу неизвестному.","Ты похож на Лусиано: верность, ответственность и желание защищать близких определяют твои решения.","Тебе близко Сердце Мира: ты умеешь объединять людей, находить связи и сохранять равновесие."];const root=document.getElementById("questions");questions.forEach((q,i)=>{const el=document.createElement("section");el.className="card";const h=document.createElement("h2");h.textContent=(i+1)+". "+q[0];el.append(h);q[1].forEach((v,j)=>{const l=document.createElement("label"),r=document.createElement("input");r.type="radio";r.name="q"+i;r.value=j;l.append(r,document.createTextNode(v));el.append(l)});root.append(el)});document.getElementById("check").onclick=()=>{const scores=[0,0,0];for(let i=0;i<questions.length;i++){const r=document.querySelector('input[name="q'+i+'"]:checked');if(!r){document.getElementById("error").textContent="Ответь на все шесть вопросов.";return}scores[Number(r.value)]++}document.getElementById("error").textContent="";const winner=scores.indexOf(Math.max(...scores));const result=document.getElementById("result");result.style.display="block";result.innerHTML="";const h=document.createElement("h2");h.textContent="Твой результат: "+names[winner];const p=document.createElement("p");p.textContent=descriptions[winner];const sub=document.createElement("p");sub.textContent=names.map((n,i)=>n+": "+scores[i]+"/6").join(" · ");result.append(h,p,sub);result.scrollIntoView({behavior:"smooth"})};</script></html>
