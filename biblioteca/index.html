<style>
:root{--bg:#f3ebe0;--paper:#fbf6ee;--ink:#2b211c;--muted:#7b6c60;--line:#e3d5c3;--rose:#b5605a;--rose-d:#8c3d3a;--ivy:#3d6a4a;--gold:#b08436;--wood:#7a4f30;--wood-d:#4d2f1b;--shadow:rgba(60,35,20,.16)}
:root[data-theme="dark"]{--bg:#16110f;--paper:#1f1916;--ink:#efe5d8;--muted:#a8998a;--line:#372c25;--rose:#e0938a;--rose-d:#f0b0a6;--ivy:#86b892;--gold:#e0b664;--wood:#5a3a24;--wood-d:#2e1c10;--shadow:rgba(0,0,0,.45)}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#16110f;--paper:#1f1916;--ink:#efe5d8;--muted:#a8998a;--line:#372c25;--rose:#e0938a;--rose-d:#f0b0a6;--ivy:#86b892;--gold:#e0b664;--wood:#5a3a24;--wood-d:#2e1c10;--shadow:rgba(0,0,0,.45)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "PT Serif",Georgia,serif;-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,select{font:inherit;color:inherit}
.ui{font-family:Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:0 22px}
/* Cabecera */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:600 22px/1 "Cormorant Garamond",serif;letter-spacing:.01em}
.brand svg{width:30px;height:30px;flex:none}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a,.chip,.tbtn{white-space:nowrap;font:500 14px Inter,system-ui,sans-serif;text-decoration:none;padding:8px 12px;border-radius:999px;border:1px solid transparent;background:none;cursor:pointer;color:var(--ink)}
nav.main a:hover,.tbtn:hover{background:color-mix(in srgb,var(--rose) 10%,transparent);color:var(--rose-d)}
nav.main a[aria-current]{background:color-mix(in srgb,var(--rose) 14%,transparent);color:var(--rose-d)}
.tools-top{display:flex;gap:4px;align-items:center;flex:none}
.tbtn{padding:7px 10px}
@media(max-width:760px){.shelf{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:28px 16px;padding:18px 8px 0}header.top .wrap{flex-wrap:wrap;padding-top:8px;padding-bottom:6px}nav.main{order:3;width:100%;margin:0;overflow-x:auto;flex-wrap:nowrap}.tools-top{margin-left:auto}}
/* Portada del sitio */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:
 radial-gradient(1200px 400px at 50% -10%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 70%),
 linear-gradient(180deg,color-mix(in srgb,var(--rose) 12%,var(--bg)),var(--bg))}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:40px;align-items:center;padding-top:56px;padding-bottom:56px}
.eyebrow{font:700 12px Inter,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--rose-d)}
h1{font:600 clamp(44px,7.2vw,86px)/.98 "Cormorant Garamond",serif;margin:.18em 0 .2em;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--rose-d)}
.sign{display:inline-block;font:italic 500 21px/1.35 "Cormorant Garamond",serif;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 2px;margin:6px 0 22px}
.lead{font-size:18.5px;max-width:42em;margin:0 0 18px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px}
.stat b{display:block;font:600 38px/1 "Cormorant Garamond",serif;color:var(--rose-d)}
.stat span{font:500 12px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.door{width:100%;max-width:380px;justify-self:center;filter:drop-shadow(0 20px 30px var(--shadow))}
.petal{position:absolute;width:14px;height:10px;border-radius:70% 0 70% 0;background:var(--rose);opacity:.45;animation:fall linear infinite;pointer-events:none}
@keyframes fall{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(560px) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){.petal{display:none}}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-top:34px;padding-bottom:34px}.door{max-width:250px;order:-1}}
/* Buscador y filtros */
.finder{border-bottom:1px solid var(--line);padding:14px 0}
.finder .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.search input{flex:1;border:0;background:none;padding:11px 0;outline:none;font-family:Inter,system-ui,sans-serif;font-size:15px}
select.sel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:14px Inter,system-ui,sans-serif;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border-color:var(--line);background:var(--paper);font-size:13px;padding:6px 11px}
.chip[aria-pressed="true"]{background:var(--rose-d);border-color:var(--rose-d);color:#fff}
.viewsw{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.viewsw button{border:0;background:var(--paper);padding:9px 12px;cursor:pointer;font:500 13px Inter,system-ui,sans-serif}
.viewsw button[aria-pressed="true"]{background:color-mix(in srgb,var(--rose) 16%,var(--paper));color:var(--rose-d)}
.count{font:13px Inter,system-ui,sans-serif;color:var(--muted);margin:18px 0 6px}
/* Estantería */
.shelf-group{margin:30px 0 46px}
.shelf-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.shelf-head h2{font:600 32px/1.1 "Cormorant Garamond",serif;margin:0}
.shelf-head p{margin:0;color:var(--muted);font-size:15px;flex:1 1 300px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:34px 22px;padding:22px 20px 0;position:relative;
 background:linear-gradient(180deg,transparent calc(100% - 0px),transparent);}
.shelf::after{content:"";display:block}
.book{display:flex;flex-direction:column;text-decoration:none;position:relative}
.book .spine{position:relative;aspect-ratio:2/3;border-radius:4px 6px 6px 4px;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 12px 18px -6px var(--shadow),0 3px 4px rgba(0,0,0,.12);transition:transform .25s ease,box-shadow .25s ease;transform-origin:left bottom;overflow:hidden}
.book:hover .spine,.book:focus-visible .spine{transform:translateY(-6px) rotate(-1.2deg);box-shadow:0 22px 30px -10px var(--shadow),0 4px 8px rgba(0,0,0,.18)}
.book svg,.book img{display:block;width:100%;height:100%;object-fit:cover}
.book .plank{height:14px;margin:0 -12px;border-radius:2px;background:linear-gradient(180deg,var(--wood),var(--wood-d));box-shadow:0 6px 10px -4px var(--shadow)}
.book .meta{padding-top:10px}
.book .t{font:600 17px/1.2 "Cormorant Garamond",serif;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.book .s{font:12px/1.4 Inter,system-ui,sans-serif;color:var(--muted);margin-top:3px}
.badge{display:inline-block;font:600 10.5px Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;border:1px solid currentColor}
.badge.real{color:var(--ivy)}.badge.ficticio{color:var(--rose-d)}.badge.fader{color:var(--gold)}
.book .badge{font-size:9.5px;padding:2px 6px;margin-top:6px}
/* Fichas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{display:grid;grid-template-columns:84px 1fr;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--rose);transform:translateY(-2px)}
.card .mini{aspect-ratio:2/3;border-radius:4px;overflow:hidden;box-shadow:0 6px 12px -6px var(--shadow)}
.card h3{font:600 20px/1.15 "Cormorant Garamond",serif;margin:2px 0 4px}
.card .o{font-style:italic;color:var(--muted);font-size:13.5px;line-height:1.35}
.card .who{font:12.5px Inter,system-ui,sans-serif;color:var(--muted);margin-top:6px}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
/* Ficha del libro */
.crumbs{font:13px Inter,system-ui,sans-serif;color:var(--muted);padding:22px 0 0}
.crumbs a{color:var(--rose-d);text-decoration:none}
.detail{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:48px;padding:24px 0 40px}
.detail .big{position:sticky;top:90px;align-self:start}
.detail .big .spine{aspect-ratio:2/3;border-radius:6px 9px 9px 6px;overflow:hidden;box-shadow:0 30px 40px -16px var(--shadow),0 6px 10px rgba(0,0,0,.2);transform:perspective(900px) rotateY(-7deg);transform-origin:left center}
.detail .big svg,.detail .big img{display:block;width:100%;height:100%;object-fit:cover}
.fiche{font:12.5px/1.5 Inter,system-ui,sans-serif;margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.fiche div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}.fiche div:last-child{border:0}
.fiche span:first-child{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding-top:2px}
.fiche span:last-child{text-align:right}
.detail h1{font-size:clamp(36px,5vw,58px);margin:.1em 0 .1em}
.orig{font:italic 500 22px/1.35 "Cormorant Garamond",serif;color:var(--muted);margin:0 0 4px}
.by{font:500 14px Inter,system-ui,sans-serif;color:var(--rose-d);margin:10px 0 20px}
.desc{font-size:18.5px;max-width:40em}
.desc::first-letter{font:600 3.4em/.8 "Cormorant Garamond",serif;float:left;margin:.08em .08em 0 0;color:var(--rose-d)}
h2.sec{font:600 28px/1.2 "Cormorant Garamond",serif;margin:38px 0 12px;display:flex;align-items:center;gap:12px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.apps{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.apps li{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--rose);border-radius:10px;padding:12px 16px}
.apps a.nov{font:600 19px/1.2 "Cormorant Garamond",serif;text-decoration:none}
.apps a.nov:hover{color:var(--rose-d)}
.apps .chp{font:12px Inter,system-ui,sans-serif;color:var(--muted);margin-left:8px}
.apps .note{margin:4px 0 0;font-size:15.5px}
.apps .read{font:600 12.5px Inter,system-ui,sans-serif;color:var(--rose-d);text-decoration:none;white-space:nowrap}
.related{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:16px}
.related .book .t{font-size:15px}
.navbook{display:flex;justify-content:space-between;gap:12px;margin-top:36px;font:500 14px Inter,system-ui,sans-serif}
.navbook a{text-decoration:none;color:var(--rose-d);max-width:48%}
@media(max-width:760px){.detail{grid-template-columns:1fr;gap:26px}.detail .big{position:static;max-width:240px;margin:auto}}
/* Salas */
.halls{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding:30px 0 60px}
.hall{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;text-decoration:none;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:250px}
.hall:hover{border-color:var(--rose)}
.hall .ic{font-size:30px}
.hall h3{font:600 27px/1.1 "Cormorant Garamond",serif;margin:0}
.hall p{margin:0;color:var(--muted);font-size:15.5px}
.hall .row{display:flex;gap:6px;margin-top:auto}
.hall .row .mini{width:44px;aspect-ratio:2/3;border-radius:3px;overflow:hidden;box-shadow:0 4px 8px -4px var(--shadow)}
.hall .n{font:600 12px Inter,system-ui,sans-serif;color:var(--rose-d);letter-spacing:.06em;text-transform:uppercase}
/* Acerca */
.prose{max-width:44em;padding:30px 0 70px}
.prose h2{font:600 34px/1.15 "Cormorant Garamond",serif;margin:1.4em 0 .4em}
.prose blockquote{margin:1.2em 0;padding:4px 0 4px 20px;border-left:3px solid var(--rose);font:italic 500 22px/1.4 "Cormorant Garamond",serif;color:var(--muted)}
.prose .rule{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:18px 0}
footer{border-top:1px solid var(--line);padding:28px 0 40px;font:13px Inter,system-ui,sans-serif;color:var(--muted)}
footer a{color:var(--rose-d)}
.fade{animation:fd .35s ease}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
</style></head>

function about(){

   <p>La Biblioteca aparece en <a href="../#/zhenshchina-iz-lepestkov">«Женщина из лепестков»</a>, donde Rosa y Alex encuentran en ella la Crónica del Origen, y en <a href="../#/tajna-v-biblioteke">«Тайна в библиотеке»</a>, el libro-juego en el que el lector entra por esa misma puerta.</p>

   <p><b>Con una excepción:</b> los mundos que nunca se cruzan con Sinea. Para los habitantes de Sinea, el mundo de «Presentimiento» no existe; existe un libro llamado «Presentimiento», que media ciudad lee y con el que media ciudad sueña. Esos libros viven en la Sala de los Mundos Vecinos.</p></div>
   <p>Cada ficha dice en qué novelas aparece el libro y lleva directo al capítulo. Las portadas son provisionales: se dibujan solas a partir del color y el motivo de cada libro, hasta que alguien pinte las verdaderas.</p>`;

   <p>Библиотека появляется в романе <a href="../#/zhenshchina-iz-lepestkov">«Женщина из лепестков»</a>, где Роза и Алекс находят в ней Хронику Истока, и в книге-игре <a href="../#/tajna-v-biblioteke">«Тайна в библиотеке»</a>, где читатель сам входит в ту же дверь.</p>
   <h2>Как составлен этот каталог</h2>

  r.dataset.theme = dark ? "light" : "dark"; try{ localStorage.setItem("bib:theme", r.dataset.theme); }catch(e){} };
addEventListener("hashchange", route);
Promise.all([fetch("libros.json", {cache:"no-cache"}).then(r => r.json()), fetch("../novels/catalog.json", {cache:"no-cache"}).then(r => r.json()).catch(() => ({novels: []}))])
 .then(([b, c]) => { BOOKS = b; (c.novels || []).forEach(n => NOV[n.slug] = n); route(); })
 .catch(() => { app.innerHTML = '<div class="wrap empty">No se pudo abrir el catálogo.</div>'; });
