<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundo literario — Robert Fader</title>
<meta name="description" content="Mundo literario — las novelas de Robert Fader en muchos idiomas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --paper:#fbf8f2; --ink:#2a2420; --muted:#7a6f64; --line:#e2d8c8;
  --accent:#8c2f2f; --accent-soft:#f0e2dc; --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.07);
  --serif:"PT Serif",Georgia,serif; --display:"Cormorant Garamond","PT Serif",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --read-size:20px;
}
:root[data-theme="dark"]{
  --bg:#16130f; --paper:#1d1914; --ink:#e9e1d4; --muted:#a19584; --line:#332c24;
  --accent:#d98c7a; --accent-soft:#2c211c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="sepia"]{
  --bg:#efe2c8; --paper:#f4e9d3; --ink:#3b2f22; --muted:#7d6a52; --line:#dcc9a6;
  --accent:#8a4b20; --accent-soft:#ead7b5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#16130f; --paper:#1d1914; --ink:#e9e1d4; --muted:#a19584; --line:#332c24;
    --accent:#d98c7a; --accent-soft:#2c211c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 20px}

/* Header */
header.top{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{font-family:var(--display);font-size:24px;font-weight:600;text-decoration:none;letter-spacing:.01em;white-space:nowrap}
.brand small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500;margin-left:8px;letter-spacing:.04em;text-transform:uppercase}
.langs{display:flex;gap:2px;font-family:var(--sans);font-size:13px}
.langs .other-site{padding:6px 7px;border-radius:6px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-decoration:none;white-space:nowrap}
.langs .other-site:hover{color:var(--accent)}
.langs button{border:0;background:none;padding:6px 7px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600;letter-spacing:.04em}
.langs button[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.langs button:hover{color:var(--ink)}

main{flex:1}
footer{border-top:1px solid var(--line);color:var(--muted);font-family:var(--sans);font-size:13px;padding:24px 0;text-align:center}

/* Characters navigation */
.character-entry{display:inline-block;margin-top:20px;border:1px solid var(--line);border-radius:30px;padding:11px 23px;text-decoration:none;font-family:var(--sans);font-size:14px;color:var(--accent);background:var(--paper);transition:transform .2s,box-shadow .2s}
.rec{display:grid;grid-template-columns:110px 1fr;gap:20px;align-items:center;max-width:720px;margin:0 auto 34px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .2s}
.rec:hover{transform:translateY(-2px)}
.rec .cover{width:110px;margin:0}
.rec-k{font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.rec h3{margin:6px 0 6px;font-size:22px}
.rec p{margin:0 0 10px;color:var(--muted);line-height:1.5}
.rec-go{font-family:var(--sans);font-size:14px;color:var(--accent)}
@media (max-width:520px){.rec{grid-template-columns:80px 1fr;gap:14px;padding:14px}.rec .cover{width:80px}.rec h3{font-size:18px}}
.character-entry:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.hero .character-entry + .character-entry{margin-left:10px}
/* Blog */
.blog-list{max-width:720px;margin:0 auto;padding:8px 0 72px;display:flex;flex-direction:column;gap:22px}
.post-card{display:grid;grid-template-columns:1fr;gap:6px;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:22px 24px;background:var(--paper);transition:transform .2s,box-shadow .2s}
.post-card.has-img{grid-template-columns:140px 1fr;gap:6px 20px}
.post-card.has-img img{grid-row:1/5;width:140px;height:140px;object-fit:cover;border-radius:8px}
.post-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.post-card h3{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.15;margin:0}
.post-card .date{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.post-card p{margin:0;color:var(--muted)}
.post-card .more{font-family:var(--sans);font-size:14px;color:var(--accent)}
@media (max-width:520px){.post-card.has-img{grid-template-columns:1fr}.post-card.has-img img{grid-row:auto;width:100%;height:auto;aspect-ratio:16/9}}
article.chapter.post p{text-align:left}
article.chapter.post a{color:var(--accent)}
/* News (satirical newspaper, one per language) */
.np{max-width:1040px;margin:0 auto;padding:28px 0 72px}
.np-mast{text-align:center;border-bottom:3px double var(--ink);padding:6px 0 14px}
.np-kick{font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.np-name{font-family:var(--display);font-weight:600;font-size:clamp(40px,8vw,82px);line-height:1;margin:8px 0 6px;letter-spacing:-.01em}
.np-tag{font-family:var(--serif);font-style:italic;color:var(--muted);margin:0}
.np-line{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink);padding:8px 2px}
.np-sec{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.np-lead{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;padding:26px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.np-lead h2{font-family:var(--display);font-weight:600;font-size:clamp(30px,4.4vw,46px);line-height:1.05;margin:8px 0 12px}
.np-lead p{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 12px}
.np-lead:hover h2,.np-card:hover h3{color:var(--accent)}
.np-img{border-radius:4px;overflow:hidden;background:var(--accent-soft);aspect-ratio:4/3}
.np-img img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.np-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.np-card{display:flex;flex-direction:column;gap:8px;padding:22px 20px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.np-grid .np-card:not(:nth-child(3n+1)){border-left:1px solid var(--line)}
.np-card .np-img{aspect-ratio:16/10}
.np-card h3{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.12;margin:0}
.np-card p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.5}
.np-from{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:auto}
.np-from b{font-weight:600;color:var(--ink)}
.np-foot{margin-top:28px;padding:16px 18px;border:1px dashed var(--line);border-radius:10px;font-family:var(--sans);font-size:13px;color:var(--muted);text-align:center}
.np-art .np-meta{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.np-art .np-meta b{color:var(--accent)}
.np-art .np-deck{font-style:italic;color:var(--muted);font-size:1.05em;line-height:1.55;border-bottom:1px solid var(--line);padding-bottom:18px;margin:0 0 22px;text-align:left}
.np-art .np-paper{font-family:var(--display);font-weight:600;font-size:22px;text-align:center;border-bottom:3px double var(--ink);padding-bottom:8px;margin-bottom:26px}
.np-art .np-paper a{color:inherit;text-decoration:none}
.np-src{display:flex;gap:16px;align-items:center;margin:34px 0 0;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);text-decoration:none;color:inherit;font-family:var(--sans);font-size:14px}
.np-src .cover{width:62px;flex:none;margin:0}
.np-src b{display:block;font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink)}
.np-src span{color:var(--accent)}
.np-more{max-width:680px;margin:0 auto;padding:0 20px 20px}
.np-more h2{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--ink);padding-top:12px}
.np-more a{display:block;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;font-family:var(--display);font-size:20px;font-weight:600;line-height:1.2}
.np-more a small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:2px}
.np-gos{margin-top:34px;border-top:3px double var(--ink);padding-top:16px}
.np-gos-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.np-gos-head h2{font-family:var(--display);font-weight:600;font-size:clamp(30px,4vw,40px);margin:0;font-style:italic}
.np-gos-grid{columns:3 280px;column-gap:28px}
.np-gos-item{break-inside:avoid;padding:14px 0;border-bottom:1px dashed var(--line);font-size:16px;line-height:1.55}
.np-gos-item::before{content:"🤫 ";}
.np-gos-item a{display:block;margin-top:6px;font-family:var(--sans);font-size:12px;color:var(--accent);text-decoration:none}
.np-gos-item a:hover{text-decoration:underline}
.np-gos{margin-top:34px;border-top:3px double var(--ink);padding-top:16px}
.np-gos-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.np-gos-h h2{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(30px,4.5vw,44px);font-style:italic;color:var(--accent)}
.np-gos-h p{margin:0;font-family:var(--serif);font-style:italic;color:var(--muted)}
.np-gos-list{columns:3 260px;column-gap:28px;column-rule:1px dashed var(--line)}
.np-gos-item{break-inside:avoid;margin:0 0 22px;padding:14px 16px;background:var(--accent-soft);border-radius:10px}
.np-gos-item h3{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:21px;line-height:1.15}
.np-gos-item p{margin:0 0 8px;font-size:15px;line-height:1.5}
.np-gos-item a{font-family:var(--sans);font-size:12px;color:var(--accent);text-decoration:none}
.np-gos-item a:hover{text-decoration:underline}
.np-line a{color:var(--accent);text-decoration:none}
@media (max-width:820px){.np-grid{grid-template-columns:1fr 1fr}.np-grid .np-card:not(:nth-child(3n+1)){border-left:0}.np-grid .np-card:nth-child(2n){border-left:1px solid var(--line)}}
@media (max-width:620px){.np{padding-top:16px}.np-lead{grid-template-columns:1fr;gap:14px}.np-lead .np-img{order:-1}.np-grid{grid-template-columns:1fr}.np-grid .np-card:nth-child(2n){border-left:0}.np-card{padding:18px 4px}.np-line{justify-content:center}}
/* Home */
.hero{padding:72px 0 40px;text-align:center}
.hero .eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(44px,8vw,80px);line-height:1.02;margin:14px 0 16px}
.hero p{max-width:560px;margin:0 auto;color:var(--muted);font-size:18px}
.ornament{color:var(--accent);font-size:20px;margin:28px 0 0;letter-spacing:.5em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px;padding:24px 0 72px}
.card{text-decoration:none;display:flex;flex-direction:column;gap:12px}
.cover{aspect-ratio:2/3;border-radius:4px 10px 10px 4px;box-shadow:var(--shadow);overflow:hidden;position:relative;transition:transform .2s ease}
.card:hover .cover{transform:translateY(-4px)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.gen{display:flex;flex-direction:column;justify-content:space-between;padding:22px 18px;color:#fbf6ec}
.cover.gen::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:rgba(0,0,0,.18)}
.cover.gen .ct{font-family:var(--display);font-size:28px;line-height:1.05;font-weight:600}
.cover.gen .ca{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.card h3{font-family:var(--display);font-size:24px;font-weight:600;margin:0;line-height:1.15}
.card .meta{font-family:var(--sans);font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px}
.pill.off{opacity:.4}
.stars{display:inline-flex;gap:1px;font-family:var(--sans);font-size:14px;line-height:1;letter-spacing:0;vertical-align:middle}
.stars i{font-style:normal;position:relative;color:color-mix(in srgb,var(--muted) 45%,transparent)}
.stars i.f{color:#d4a017}
.stars i.h::before{content:"★";position:absolute;left:0;top:0;width:50%;overflow:hidden;color:#d4a017}
.stars small{margin-left:5px;font-size:11px;color:var(--muted);font-weight:600}
.card .stars{margin-top:4px}
/* Personal reading progress and local favourites */
.library-heading{font-family:var(--display);font-size:30px;font-weight:600;margin:30px 0 12px}
.rbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.rbar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.rbar.sm{height:4px}
.rprog{margin:18px 0;font-family:var(--sans);font-size:13px}
.rprog-t{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;color:var(--muted)}
.rprog-t b{color:var(--fg,inherit);font-weight:600}
.mr-list{max-width:760px;margin:0 auto 60px}
.mr-row{display:grid;grid-template-columns:72px 1fr;gap:18px;align-items:center;padding:16px 0;border-top:1px solid var(--line);text-decoration:none}
.mr-row .cover{width:72px}
.mr-row .cover .ct{font-size:11px}.mr-row .cover .ca,.mr-row .badge18{display:none}
.mr-row h3{font-family:var(--display);font-size:22px;font-weight:600;margin:0 0 2px;line-height:1.15}
.mr-row small{font-family:var(--sans);color:var(--muted)}
.mr-row .rprog{margin:8px 0 0}
.by .stars{margin-left:2px}
.empty{text-align:center;color:var(--muted);padding:40px 0 80px;font-size:18px}

/* Novel page */
.novel{display:grid;grid-template-columns:260px 1fr;gap:48px;padding:48px 0 72px}
.novel .cover{max-width:260px}
.novel h1{font-family:var(--display);font-weight:500;font-size:clamp(38px,6vw,58px);line-height:1.05;margin:0 0 6px}
.novel .by{font-family:var(--sans);color:var(--muted);font-size:14px;margin-bottom:22px}
.novel .desc{font-size:18px;margin-bottom:28px;white-space:pre-line}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:14px;font-weight:600;background:var(--accent);color:#fff;text-decoration:none;padding:11px 18px;border-radius:8px;border:0;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:36px}
.toc h2{font-family:var(--sans);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.toc ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.toc li a{display:flex;gap:16px;padding:13px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-size:18px}
.toc li a:hover{color:var(--accent)}
.toc .n{font-family:var(--sans);color:var(--muted);font-size:13px;min-width:26px;padding-top:4px}
.toc .done .n::after{content:" ✓";color:var(--accent)}
.notice{font-family:var(--sans);font-size:14px;background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin-bottom:24px}
.notice a{color:var(--accent);font-weight:600;cursor:pointer}
.saga{margin:28px 0 0;min-width:0}
.novel > div{min-width:0}
.saga h2{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.saga .row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.saga a{flex:0 0 92px;text-decoration:none;color:inherit;font-family:var(--sans);font-size:12px;line-height:1.3}
.saga a .cover{border-radius:3px 7px 7px 3px;margin-bottom:6px}
.saga a .cover.gen{padding:8px 7px}.saga a .cover.gen .ct{font-size:12px}.saga a .cover.gen .ca{font-size:7px}
.saga a .badge18{display:none}
.saga a.cur{opacity:.55;pointer-events:none}
.saga a small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.saga-description{font-family:var(--sans);font-size:13px;line-height:1.55;color:var(--muted);margin:0 0 14px;max-width:680px}

/* Reader */
.reader-bar{position:sticky;top:60px;z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.reader-bar .wrap{display:flex;align-items:center;justify-content:space-between;height:46px;font-family:var(--sans);font-size:13px;gap:10px}
.reader-bar .crumb{color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:4px;align-items:center}
.tools button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 9px;cursor:pointer;font-weight:600;font-size:13px}
.tools .sw{width:24px;height:24px;padding:0;border-radius:50%}
.progress{height:2px;background:var(--accent);width:0;transition:width .1s}
article.chapter{max-width:680px;margin:0 auto;padding:56px 20px 40px;font-size:var(--read-size);line-height:1.75}
article.chapter .kicker{font-family:var(--sans);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);text-align:center;font-weight:600}
article.chapter h1{font-family:var(--display);font-weight:500;text-align:center;font-size:1.9em;line-height:1.15;margin:10px 0 40px}
article.chapter p{margin:0 0 1.1em;text-align:justify;hyphens:auto}
article.chapter hr{border:0;text-align:center;margin:2em 0}
article.chapter h2{font-family:var(--display);font-weight:500;text-align:center;font-size:1.4em;margin:1.6em 0 .8em}
article.chapter h2 ~ p{text-align:left;font-size:.92em}
article.chapter .gloss{cursor:help;border-bottom:1.5px dotted var(--accent);-webkit-tap-highlight-color:transparent;outline:none}
.gl-pick{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:-24px 0 34px;font-family:var(--sans);font-size:12.5px;color:var(--muted)}
.gl-pick button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 11px;font:600 12px var(--sans);letter-spacing:.05em;cursor:pointer}
.gl-pick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.gl-side{max-width:680px;margin:0 auto 28px;padding:0 20px;font-family:var(--sans)}
.gl-side details{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:4px 14px}
.gl-side summary{cursor:pointer;padding:10px 0;font-weight:600;font-size:14px;color:var(--ink)}
.gl-side .gl-title{display:none;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:4px 0 8px}
.gl-side ol{list-style:none;margin:0 0 10px;padding:0;columns:2;column-gap:22px}
.gl-side li{break-inside:avoid}

:root[data-theme="dark"] article.chapter p.mc.ok{background:#23382b;border-color:#3f6b4d}

@media (prefers-color-scheme: dark){:root:not([data-theme]) article.chapter p.mc.ok{background:#23382b;border-color:#3f6b4d}:root:not([data-theme]) article.chapter p.mc.bad{background:#3d2420;border-color:#7a3f36}}
article.chapter .vfcheck{display:flex;align-items:center;gap:14px;margin:.6em 0 1.4em;font-family:var(--sans);font-size:14px}

article.chapter div.psyr{margin:1em 0;padding:12px 16px;border-radius:10px;background:var(--accent-soft)}

.tbl{overflow-x:auto;margin:1em 0}

.pager{max-width:680px;margin:0 auto 80px;padding:0 20px;display:flex;justify-content:space-between;gap:12px}

/* ───────── Lesson / final test ───────── */
.ls{--ok:#3f8f1e;--ok-bg:#dff5cf;--ok-ink:#2f6d14;--bad:#d63a2f;--bad-bg:#ffe1dd;--bad-ink:#a8261d;--gold:#e0a82e;--sel:#3b6fb6;--sel-bg:#e3eefb;--on-ok:#fff;--on-bad:#fff;
  font-family:var(--sans);max-width:680px;margin:0 auto;padding:0 20px;position:relative}
:root[data-theme="dark"] .ls{--on-ok:#11240a;--on-bad:#2a0c09;--ok:#7cc95a;--ok-bg:#1f3318;--ok-ink:#9ee07a;--bad:#ff7a6e;--bad-bg:#3a1d1a;--bad-ink:#ff9d93;--sel:#7fb0f0;--sel-bg:#1c2a3d}
@media (prefers-color-scheme: dark){:root:not([data-theme]) .ls{--on-ok:#11240a;--on-bad:#2a0c09;--ok:#7cc95a;--ok-bg:#1f3318;--ok-ink:#9ee07a;--bad:#ff7a6e;--bad-bg:#3a1d1a;--bad-ink:#ff9d93;--sel:#7fb0f0;--sel-bg:#1c2a3d}}
.ls h1{font-family:var(--display);font-weight:600;font-size:clamp(36px,7vw,52px);line-height:1.05;margin:6px 0 10px}
.ls-intro,.ls-end{text-align:center;padding:48px 20px 80px}
.ls-kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
.ls-sub{color:var(--muted);font-size:17px;margin:0 auto 22px;max-width:460px;font-family:var(--serif)}
.ls-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.ls-chips span{border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.ls-best{font-size:14px;color:var(--muted);margin-bottom:20px}
.ls-link{display:block;width:max-content;margin:18px auto 0;color:var(--muted);font-size:14px;font-weight:600;text-decoration:none}
.ls-link:hover{color:var(--accent)}
.ls-mascot{width:120px;height:140px;margin:0 auto 6px}
.ls-mascot .tulip{width:100%;height:100%;filter:drop-shadow(0 8px 10px rgba(120,30,20,.18))}
.bounce .tulip{animation:lsBob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.jump .tulip{animation:lsJump .9s cubic-bezier(.3,1.6,.5,1) 3;transform-origin:50% 100%}
@keyframes lsBob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
@keyframes lsJump{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-22px) scale(1.05,.95)}100%{transform:translateY(0)}}

/* 3D chunky buttons */
.ls-btn{font:700 15px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;border-radius:16px;padding:16px 26px;cursor:pointer;border:2px solid transparent;border-bottom-width:5px;min-width:180px;transition:transform .06s,filter .15s}
.ls-btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px;margin-top:3px}
.ls-btn.go{background:var(--accent);color:#fff;border-color:color-mix(in srgb,var(--accent) 72%,#000)}
.ls-btn.go:hover:not(:disabled){filter:brightness(1.08)}
.ls-btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.ls-btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:default}

/* Play screen */
.ls-play{min-height:calc(100vh - 60px);display:flex;flex-direction:column;padding-bottom:150px}
.ls-top{display:flex;align-items:center;gap:14px;padding:22px 0 10px}
.ls-x{font-size:22px;color:var(--muted);text-decoration:none;line-height:1;padding:4px}
.ls-x:hover{color:var(--ink)}
.ls-bar{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.ls-fill{height:100%;width:0;background:var(--ok);border-radius:999px;transition:width .45s cubic-bezier(.3,1.3,.5,1);position:relative}
.ls-fill::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.ls-hearts{font-weight:800;color:var(--bad);font-size:16px;white-space:nowrap}
.ls-hearts.hit{animation:lsShake .45s}
@keyframes lsShake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.ls-snd{border:0;background:none;font-size:18px;cursor:pointer;padding:4px;opacity:.75}
.ls-stage{padding-top:18px}
.ls-stage .ls-img{margin-bottom:14px}
.ls-stage .ls-img img{max-height:180px}
.ls-stage.in{animation:lsIn .35s ease}
@keyframes lsIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.ls-img{margin:0 0 20px;text-align:center}
.ls-img img{max-width:100%;max-height:260px;border-radius:18px;border:2px solid var(--line);box-shadow:var(--shadow)}
.ls-target{color:var(--accent);white-space:nowrap}
.ls-pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.ls-opt.pic{flex-direction:column;align-items:stretch;gap:10px;padding:10px;text-align:center}
.ls-opt.pic img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#fff}
.ls-hero{position:relative;max-width:420px;margin:0 auto 18px}
.ls-hero img{width:100%;max-height:340px;object-fit:cover;object-position:50% 22%;border-radius:22px;border:2px solid var(--line);box-shadow:var(--shadow);display:block}
.ls-hero .ls-mascot{position:absolute;left:-26px;bottom:-30px;width:96px;height:112px;margin:0}
.ls-opt.pic span{display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px}
.ls-q{font-size:clamp(22px,4.5vw,28px);font-weight:800;margin:0 0 22px;color:var(--ink)}
.ls-word{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--display);font-size:clamp(38px,8vw,54px);font-weight:600;margin:6px 0 26px;color:var(--ink)}
.ls-word.es{font-family:var(--serif);font-size:clamp(28px,6vw,40px);font-style:italic}
.ls-say{width:46px;height:46px;border-radius:14px;border:0;background:var(--sel);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--sel) 65%,#000);flex:none}
.ls-say.sm{width:30px;height:30px;font-size:14px;border-radius:9px;margin-right:8px;box-shadow:0 3px 0 color-mix(in srgb,var(--sel) 65%,#000);vertical-align:2px}
.ls-say:active{transform:translateY(3px);box-shadow:none}

.ls-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ls-list{display:grid;gap:10px}
.ls-opt{display:flex;align-items:center;gap:12px;text-align:left;font:600 17px/1.3 var(--sans);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:16px;cursor:pointer;transition:background .15s,border-color .15s,transform .06s}
.ls-opt:hover:not(:disabled){background:var(--accent-soft)}
.ls-opt:active:not(:disabled){transform:translateY(2px)}
.ls-opt kbd{font:700 12px var(--sans);color:var(--muted);border:2px solid var(--line);border-radius:8px;min-width:26px;height:26px;display:inline-grid;place-items:center;flex:none}
.ls-opt.sel{border-color:var(--sel);background:var(--sel-bg);color:var(--sel)}
.ls-opt.sel kbd{border-color:var(--sel);color:var(--sel)}
.ls-opt.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink)}
.ls-opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink)}
.ls-opt.good kbd{border-color:var(--ok);color:var(--ok-ink)}
.ls-opt.bad kbd{border-color:var(--bad);color:var(--bad-ink)}
.ls-opt:disabled{cursor:default}

.ls-match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ls-match>div{display:grid;gap:10px}
.ls-opt.m{justify-content:center;text-align:center;padding:15px 10px}
.ls-opt.m.good{opacity:.55}
.ls-opt.m.nope{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink);animation:lsShake .4s}

.ls-bubble-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:22px}
.ls-mini{width:74px;height:86px;flex:none}
.ls-mini .tulip{width:100%;height:100%}
.ls-bubble{position:relative;border:2px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--paper);flex:1}
.ls-bubble::before{content:"";position:absolute;left:-10px;bottom:18px;width:16px;height:16px;background:var(--paper);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.ls-cz{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--ink)}
.ls-es{font-family:var(--serif);color:var(--muted);font-size:15px;margin-top:4px}
.ls-es.big{font-size:21px;color:var(--ink);margin:0}

.ls-sentence{font-family:var(--serif);font-size:22px;line-height:2.1;margin:6px 0 26px;color:var(--ink)}
.ls-blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--line);text-align:center;cursor:pointer;line-height:1.4;padding:0 6px}
.ls-blank.on{border-color:var(--sel);color:var(--sel);font-weight:700}
.ls-answer{min-height:64px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:22px;background:repeating-linear-gradient(transparent 0 58px,var(--line) 58px 60px)}
.ls-bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ls-chip{font:600 18px/1 var(--sans);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 16px;cursor:pointer}
.ls-chip:active:not(:disabled){transform:translateY(2px)}
.ls-chip.used{color:transparent;background:var(--line);border-color:var(--line);pointer-events:none}
.ls-chip.in{animation:lsPop .18s}
@keyframes lsPop{from{transform:scale(.85)}to{transform:none}}

.ls-input{width:100%;font:600 22px var(--sans);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:16px 18px;outline:none}
.ls-input:focus{border-color:var(--sel)}
.ls-keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;justify-content:center}
.ls-key{font:600 16px var(--sans);min-width:38px;height:38px;border-radius:10px;border:2px solid var(--line);border-bottom-width:3px;background:var(--paper);color:var(--ink);cursor:pointer}

/* Footer / feedback sheet */
.ls-foot{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:var(--bg);z-index:20;transition:background .2s}
.ls-foot-in{max-width:680px;margin:0 auto;padding:18px 20px calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ls-msg{flex:1 1 240px;min-height:20px}
.ls-foot .ls-btn.go{margin-left:auto}
.ls-foot.ok{background:var(--ok-bg);border-color:transparent}
.ls-foot.ok .ls-msg{color:var(--ok-ink)}
.ls-foot.ok .ls-btn.go{color:var(--on-ok);background:var(--ok);border-color:color-mix(in srgb,var(--ok) 70%,#000)}
.ls-foot.bad{background:var(--bad-bg);border-color:transparent}
.ls-foot.bad .ls-msg{color:var(--bad-ink)}
.ls-foot.bad .ls-btn.go{color:var(--on-bad);background:var(--bad);border-color:color-mix(in srgb,var(--bad) 70%,#000)}
.ls-verdict{font-size:21px;font-weight:800;margin-bottom:4px}
.ls-msg .sol{font-size:17px;font-weight:600}
.ls-msg .tr{font-family:var(--serif);font-size:15px;opacity:.9;margin-top:3px}
.ls-streak{display:inline-block;font-size:14px;background:var(--gold);color:#fff;border-radius:999px;padding:2px 9px;vertical-align:3px;margin-left:6px}

/* End screen */
.ls-end{position:relative;overflow:hidden}
.ls-end canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ls-stats{display:flex;gap:12px;justify-content:center;margin:8px 0 28px;flex-wrap:wrap}
.ls-stat{border:2px solid;border-radius:16px;overflow:hidden;min-width:120px;text-align:center}
.ls-stat .h{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:6px 10px}
.ls-stat .v{font-size:22px;font-weight:800;padding:12px 10px;background:var(--paper);color:var(--ink)}
.ls-stat.xp{border-color:var(--gold)} .ls-stat.xp .h{background:var(--gold)}
.ls-stat.acc{border-color:var(--ok)} .ls-stat.acc .h{background:var(--ok)}
.ls-stat.tm{border-color:var(--sel)} .ls-stat.tm .h{background:var(--sel)}
.ls-end.lost h1{color:var(--bad)}

@media (max-width:560px){
  .ls-grid{grid-template-columns:1fr}
  .ls-opt{font-size:16px;padding:14px}
  .ls-msg{flex:1 1 100%}
  .ls-msg:empty{display:none}
  .ls-foot .ls-btn{flex:1 1 auto;min-width:0;padding:15px 14px}
  .ls-foot .ls-btn.ghost{flex:0 0 auto}
  .ls-foot .ls-btn.go{margin-left:0}
  .ls-mini{width:58px;height:68px}
  .ls-sentence{font-size:20px}
}
@media (prefers-reduced-motion: reduce){.ls *{animation:none!important;transition:none!important}}

@media (max-width:720px){
  .novel{grid-template-columns:1fr;gap:28px;padding-top:28px}
  .novel .cover{max-width:200px}
  .brand small{display:none}
  .brand{flex:none}
  .langs{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;min-width:0;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .langs::-webkit-scrollbar{display:none}
  .grid{grid-template-columns:repeat(2,1fr);gap:18px}
  .card h3{font-size:20px}
  .cover.gen .ct{font-size:22px}
  article.chapter{padding-top:36px}
  article.chapter p{text-align:left}
}

.music button{border:0;background:transparent;color:var(--ink);cursor:pointer;width:32px;height:32px;border-radius:50%;font-size:14px;line-height:1;flex:none}

<script>
/* Reader reflection panel for Предчувствие: literary discussion, never language drills. */
function setupPredchuvstvieReflection(root) {
  const article = root.querySelector("article.chapter");
  if (!article) return;
  const key = "predchuvstvie:reflection:v1";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(key) || "{}"); } catch (_) {}
  const save = () => { try { localStorage.setItem(key, JSON.stringify(saved)); } catch (_) {} };
  const answers = {17:true,18:false,19:true,20:true,21:false,22:true,23:false,24:true,25:false,26:true,27:true,28:true,29:false,30:false};
  const result = document.createElement("section");
  result.className = "reflection-result";
  result.innerHTML = '<h2>Ваши ответы</h2><p class="reflection-status" role="status" aria-live="polite">Выберите варианты. Ваши ответы сохраняются только в этом браузере.</p><button type="button" class="btn reflection-check">Проверить факты сюжета</button> <button type="button" class="btn ghost reflection-reset">Начать заново</button>';
  const profiles = [
    {title:"Идеалист",description:"В ваших ответах заметна вера в ценность надежды, человеческого достоинства и взаимной поддержки. Вам близка мечта Роберта о мире, который можно построить заново."},
    {title:"Прагматик",description:"Вы склонны замечать последствия решений, необходимость защиты и сложность компромиссов. Для вас важно не только провозгласить идеал, но и сохранить его в опасном мире."},
    {title:"Бунтарь",description:"Вы особенно остро воспринимаете давление власти и толпы. Вас привлекают свобода выбора, право сомневаться и способность противостоять навязанным правилам."},
    {title:"Наблюдатель",description:"Вы видите противоречия персонажей и не спешите делить их на героев и злодеев. Вам важнее понять скрытые мотивы, чем выбрать безусловно правую сторону."}
  ];
  const profilePanel=document.createElement("section");
  profilePanel.className="reflection-result reflection-profile";
  profilePanel.innerHTML='<h2>Кем вы могли бы стать в «Нашей Утопии»?</h2><p class="reflection-profile-text" role="status" aria-live="polite"></p><p><small>Это литературная интерпретация ответов, а не психологический тест или диагноз. Ни один тип не лучше другого.</small></p><button type="button" class="btn reflection-profile-button">Узнать свой образ</button>';
  function updateProfile(show=false) {
    const el=profilePanel.querySelector(".reflection-profile-text");
    const selected=Array.from({length:16},(_,i)=>saved[i+1]).filter(v=>/^[0-3]$/.test(v||""));
    if(selected.length<12){el.textContent="Ответьте хотя бы на 12 из 16 философских и психологических вопросов. Сейчас: "+selected.length+" из 16.";return;}
    if(!show && !profilePanel.dataset.shown){el.textContent="Образ готов. Нажмите «Узнать свой образ».";return;}
    const counts=[0,0,0,0];
    // Each response reflects a *literary* reading style, not a clinical trait.
    const mapping=[
      [0,1,3,3],[1,2,3,0],[0,2,1,3],[0,1,2,3],
      [0,3,1,1],[2,3,0,3],[1,2,0,3],[0,3,1,2],
      [0,2,1,3],[2,1,0,3],[1,2,1,0],[1,0,1,3],
      [3,2,2,1],[0,0,2,2],[0,1,3,3],[0,3,3,1]
    ];
    for(let i=0;i<16;i++) if(/^[0-3]$/.test(saved[i+1]||"")) counts[mapping[i][Number(saved[i+1])]]++;
    const best=Math.max(...counts), ties=counts.map((v,i)=>v===best?i:-1).filter(i=>i>=0);
    const p=profiles[ties[0]]; const second=counts.map((v,i)=>({v,i})).filter(x=>x.i!==ties[0]).sort((a,b)=>b.v-a.v)[0];
    el.textContent=p.title+" — "+p.description+(ties.length>1?" В ваших ответах также заметны черты образа «"+profiles[ties[1]].title+"».":second.v>=best-2?" Вам также близок образ «"+profiles[second.i].title+"».":"");
    profilePanel.dataset.shown="1";
  }
  profilePanel.querySelector(".reflection-profile-button").onclick=()=>updateProfile(true);
  const qNodes = [...article.querySelectorAll("p")].filter(p => /^\s*(?:\*\*)?(?:[1-9]|[12][0-9]|30)\.\s/.test(p.textContent));
  let found = 0;
  qNodes.forEach(p => {
    const match = p.textContent.match(/^\s*(\d+)\.\s/);
    if (!match) return;
    const num = Number(match[1]);
    if (num < 1 || num > 30) return;
    const next = p.nextElementSibling;
    if (!next) return;
    const group = document.createElement("fieldset");
    group.className = "reflection-card";
    const title = document.createElement("legend");
    title.textContent = p.textContent.replace(/^\s*\d+\.\s*/, "");
    group.appendChild(title);
    if (num <= 16 && next.tagName === "UL") {
      [...next.querySelectorAll(":scope > li")].forEach((li, i) => {
        const label = document.createElement("label");
        label.className = "reflection-option";
        const input = document.createElement("input");
        input.type = "radio"; input.name = "reflection-" + num; input.value = String(i);
        input.checked = saved[num] === String(i);
        input.onchange = () => { saved[num] = input.value; save(); updateProfile(); };
        label.append(input, document.createTextNode(" " + li.textContent));
        group.appendChild(label);
      });
      next.replaceWith(group); p.remove(); found++;
    } else if (num >= 17 && num <= 30 && next.tagName === "P" && /Правда/.test(next.textContent) && /Ложь/.test(next.textContent)) {
      [["true","Правда"],["false","Ложь"]].forEach(([val,word]) => {
        const label = document.createElement("label");
        label.className = "reflection-option";
        const input = document.createElement("input");
        input.type = "radio"; input.name = "reflection-" + num; input.value = val;
        input.checked = saved[num] === val;
        input.onchange = () => { saved[num] = val; save(); group.classList.remove("reflection-correct","reflection-incorrect"); };
        label.append(input,document.createTextNode(" " + word)); group.appendChild(label);
      });
      next.replaceWith(group);p.remove();found++;
    }
    group.dataset.question = num;
  });
  if (!found) return;
  const h = document.createElement("p");
  h.className = "reflection-intro";
  h.textContent = "Выберите один вариант в каждом вопросе. В первых двух разделах нет правильных или неправильных решений: важна ваша интерпретация.";
  article.insertBefore(h,article.querySelector("h2") || article.firstChild);
  const details = [...article.querySelectorAll("details")];
  if (details.length) details[0].open = false;
  const ending = document.createElement("section");
  ending.className="reflection-ending";
  ending.appendChild(profilePanel);
  ending.appendChild(result);
  updateProfile();
  article.appendChild(ending);
  result.querySelector(".reflection-check").onclick = () => {
    let correct=0, done=0;
    for(const [n,expected] of Object.entries(answers)){
      const card=article.querySelector('[data-question="'+n+'"]');
      if (!card) continue;
      const val=saved[n];
      card.classList.remove("reflection-correct","reflection-incorrect");
      if(val==="true"||val==="false"){
        done++;
        const ok=(val==="true")===expected;
        if(ok)correct++;
        card.classList.add(ok?"reflection-correct":"reflection-incorrect");
      }
    }
    result.querySelector(".reflection-status").textContent="Проверено: "+done+" из 14. Верных ответов: "+correct+". Ошибки выделены, а пояснения находятся в раскрывающемся ключе выше.";
    result.scrollIntoView({behavior:"smooth",block:"center"});
  };
  result.querySelector(".reflection-reset").onclick = () => {
    saved={};save();delete profilePanel.dataset.shown;updateProfile();
    article.querySelectorAll(".reflection-card input").forEach(x=>x.checked=false);
    article.querySelectorAll(".reflection-card").forEach(x=>x.classList.remove("reflection-correct","reflection-incorrect"));
    result.querySelector(".reflection-status").textContent="Ответы очищены. Вы можете пройти вопросы ещё раз.";
  };
}

    const psyr = b.match(/^\{=([A-Z])\}\s*([\s\S]+)$/);
    if (psyr) return `<div class="psyr" data-k="${psyr[1]}" hidden><p>${inline(psyr[2]).replace(/\n/g,"<br>")}</p></div>`;
    const mc = b.match(/^([\s\S]*?)\s*\[\[([^\]]*\|[^\]]*)\]\]([\s\S]*)$/);
    if (mc) { const ops = mc[2].split("|"); const a = ops.findIndex(o => o.trim().startsWith("*"));
      const q = mc[3].trim() ? inline(mc[1]) + " ＿＿＿ " + inline(mc[3].trim()) : inline(mc[1]);
      return `<p class="mc" data-a="${a}"><span class="vfq">${q}</span><select aria-label="Respuesta"><option value="" selected disabled>— elige —</option>${ops.map((o,i) => `<option value="${i}">${esc(o.trim().replace(/^\*/,""))}</option>`).join("")}</select></p>`; }
    const vf = b.match(/^([\s\S]*?)\s*\(\s*V\s*\/\s*F\s*\)\s*\{([VF])\}\s*$/);
    if (vf) return `<p class="vf" data-a="${vf[2]}"><span class="vfq">${inline(vf[1])}</span><span class="vfb"><button type="button" data-v="V" aria-pressed="false">V</button><button type="button" data-v="F" aria-pressed="false">F</button></span></p>`;
    return "<p>" + inline(b).replace(/\n/g,"<br>") + "</p>";
  }).join("\n");
}

const QUIZ_T = {ld:["Kontroli","korrekt","Proba snova"], es:["Comprobar","correctas","Volver a intentar"], it:["Verifica","corrette","Riprova"], en:["Check","correct","Try again"], ru:["Проверить","правильно","Ещё раз"], pt:["Verificar","corretas","Tentar de novo"], fr:["Vérifier","correctes","Réessayer"], de:["Prüfen","richtig","Nochmal"], cs:["Zkontrolovat","správně","Zkusit znovu"], pl:["Sprawdź","poprawnie","Spróbuj ponownie"], sr:["Провери","тачно","Покушај поново"], bg:["Провери","вярно","Опитай пак"], eo:["Kontroli","ĝustaj","Reprovi"], tr:["Kontrol et","doğru","Tekrar dene"], ia:["Verificar","correcte","Reprobar"], isv:["Provjerj","pravilno","Poprobuj opet"], la:["Proba","recta","Iterum"], sw:["Angalia","sahihi","Jaribu tena"], vec:["Controla","giuste","Prova ancora"]};
function setupQuizzes(root, lang){
  const T = QUIZ_T[lang] || QUIZ_T.es;
  const items = [...root.querySelectorAll("p.vf, p.mc")];
  const PICK = {es:"— elige —", it:"— scegli —", en:"— choose —", ru:"— выбери —", pt:"— escolha —", fr:"— choisis —", de:"— wähle —", cs:"— vyber —", pl:"— wybierz —", sr:"— изабери —", bg:"— избери —", eo:"— elektu —", tr:"— seç —", ia:"— elige —", isv:"— izberi —", la:"— elige —", sw:"— chagua —", vec:"— sièlzi —"};
  root.querySelectorAll("p.mc select").forEach(sel => { if (sel.options[0]) sel.options[0].textContent = PICK[lang] || PICK.es; });
  if (lang === "en") root.querySelectorAll('p.vf button[data-v="V"]').forEach(b => b.textContent = "T");
  if (lang === "cs") root.querySelectorAll("p.vf button[data-v]").forEach(b => { b.textContent = b.dataset.v === "V" ? "Pravda" : "Lež"; });
  if (lang === "ru") root.querySelectorAll("p.vf button[data-v]").forEach(b => { b.textContent = b.dataset.v === "V" ? "Да" : "Нет"; b.title = b.dataset.v === "V" ? "Верно" : "Неверно"; });
  const isModule = !!root.querySelector("article.chapter") && /^(?:modulo-[1-4]|test-final)[.]md$/.test(window.__activeChapterFile || "");
  if (isModule && items.length) {
    const chapter = root.querySelector("article.chapter");
    const key = "module-best:el-tren-fantasma:" + window.__activeChapterFile;
    const finalExam = window.__activeChapterFile === "test-final.md";
    const box = document.createElement("section");
    box.className = "module-score";
    box.style.cssText = "max-width:720px;margin:2em auto;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--accent-soft);text-align:center";
    box.innerHTML = '<h2 style="margin:.1em 0 .6em">' + (finalExam ? 'Evaluación final de la novela' : 'Evaluación del módulo') + '</h2><p class="module-best"></p><button type="button" class="btn module-grade">Calificar módulo</button><button type="button" class="btn ghost module-retry" style="margin-left:10px" hidden>Repetir examen</button><p class="module-result" role="status" aria-live="polite"></p><p><a href="#/el-tren-fantasma/progreso">Ver mi progreso completo →</a></p>';
    chapter.appendChild(box);
    const bestEl = box.querySelector(".module-best"), result = box.querySelector(".module-result");
    const grade = box.querySelector(".module-grade"), retry = box.querySelector(".module-retry");
    const best = () => { const v = store.get(key, null); bestEl.textContent = v === null ? "Todavía no hay una calificación guardada." : "Mejor nota: " + v + " / 100"; };
    best();
    items.forEach(p => {
      p.querySelectorAll("button[data-v]").forEach(b => b.onclick = () => {
        p.dataset.sel = b.dataset.v;
        p.querySelectorAll("button[data-v]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        p.classList.remove("ok", "bad");
      });
      const select = p.querySelector("select");
      if (select) select.onchange = () => { p.dataset.sel = select.value; p.classList.remove("ok", "bad"); };
    });
    grade.onclick = () => {
      const answered = items.filter(p => p.dataset.sel !== undefined && p.dataset.sel !== "").length;
      if (answered < items.length) { result.textContent = "Respondé todas las preguntas antes de calificar (" + answered + " de " + items.length + ")."; return; }
      const correct = items.reduce((count,p) => {
        const ok = p.dataset.sel === p.dataset.a;
        p.classList.toggle("ok", ok); p.classList.toggle("bad", !ok);
        return count + Number(ok);
      }, 0);
      const score = Math.round(100 * correct / items.length);
      const previous = store.get(key, null);
      if (previous === null || score > previous) store.set(key, score);
      best();
      result.textContent = "Resultado: " + score + " / 100 · " + correct + " de " + items.length + " respuestas correctas." + (finalExam ? (score >= 70 ? " ¡Aprobado!" : " Necesitás 70 puntos para aprobar.") : "");
      grade.hidden = true; retry.hidden = false;
      items.forEach(p => { p.querySelectorAll("button,select").forEach(el => el.disabled = true); });
    };
    retry.onclick = () => {
      items.forEach(p => {
        delete p.dataset.sel; p.classList.remove("ok", "bad");
        p.querySelectorAll("button[data-v]").forEach(b => { b.disabled = false; b.setAttribute("aria-pressed", "false"); });
        const sel = p.querySelector("select"); if (sel) { sel.disabled = false; sel.selectedIndex = 0; }
      });
      result.textContent = ""; grade.hidden = false; retry.hidden = true;
      box.scrollIntoView({behavior:"smooth",block:"nearest"});
    };
    return;
  }
  const groups = [];
  items.forEach(p => { const prev = p.previousElementSibling; if (prev && (prev.classList.contains("vf") || prev.classList.contains("mc")) && groups.length) groups[groups.length-1].push(p); else groups.push([p]); });
  groups.forEach(g => {
    const bar = document.createElement("div"); bar.className = "vfcheck";
    bar.innerHTML = `<button type="button" class="vfgo">${T[0]}</button><span class="vfres" aria-live="polite"></span>`;
    g[g.length-1].after(bar);
    const res = bar.querySelector(".vfres"), go = bar.querySelector(".vfgo");
    let checked = false;
    const reset = () => { checked = false; g.forEach(p => p.classList.remove("ok","bad")); res.textContent = ""; go.textContent = T[0]; };
    g.forEach(p => p.querySelectorAll("button").forEach(btn => btn.onclick = () => {
      if (checked) reset();
      p.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === btn ? "true" : "false"));
      p.dataset.sel = btn.dataset.v;
    }));
    g.forEach(p => { const sel = p.querySelector("select"); if (sel) sel.onchange = () => { if (checked) reset(); p.dataset.sel = sel.value; }; });
    go.onclick = () => {
      if (checked) { g.forEach(p => { delete p.dataset.sel; p.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed","false")); const sel = p.querySelector("select"); if (sel) sel.selectedIndex = 0; }); reset(); return; }
      let ok = 0;
      g.forEach(p => { const good = p.dataset.sel === p.dataset.a; if (good) ok++; p.classList.toggle("ok", good); p.classList.toggle("bad", !good); });
      res.textContent = `${ok} / ${g.length} ${T[1]}`; go.textContent = T[2]; checked = true;
    };
  });
}

function easterOf(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }

   "LITMIR-ENC1:", but there are none any more.) */

const ENC_MARK = "LITMIR-ENC1:";

/* ───────── Long chapters are shown as pages of ~PAGE_CHARS characters ───────── */
const PAGE_CHARS = 6000, PAGE_MIN_LAST = 1500;
const PAGE_WORD = {vec:"Pàxena",ru:"Страница",es:"Página",it:"Pagina",en:"Page",de:"Seite",fr:"Page",tr:"Sayfa",pt:"Página",cs:"Strana",pl:"Strona",sr:"Strana",eo:"Paĝo",la:"Pagina",sw:"Ukurasa",ia:"Pagina",bg:"Страница",uk:"Сторінка"};
function splitPages(md){
  const manual = md.split(/\n[ \t]*<!--\s*pagebreak\s*-->[ \t]*(?:\n|$)/i);
  if (manual.length > 1) return manual;
  if (/\[\[|^\{=/m.test(md)) return [md];                      // interactive blocks stay together
  const blocks = md.replace(/\r/g,"").split(/\n\s*\n/).filter(b => b.trim());
  const isImg = b => /^\[?!\[/.test(b.trim());
  const len = b => isImg(b) ? 0 : b.length;
  if (blocks.reduce((s,b) => s + len(b), 0) <= PAGE_CHARS + PAGE_MIN_LAST) return [md];
  const pages = []; let cur = [], size = 0;
  for (const b of blocks) {
    if (size >= PAGE_CHARS && !isImg(b)) {
      const carry = []; while (cur.length && isImg(cur[cur.length-1])) carry.unshift(cur.pop());  // keep a picture with the text after it
      pages.push(cur); cur = carry; size = 0;
    }
    cur.push(b); size += len(b);
  }
  if (cur.length) { const s = cur.reduce((x,b) => x + len(b), 0);
    if (pages.length && s < PAGE_MIN_LAST) pages[pages.length-1].push(...cur); else pages.push(cur); }
  return pages.map(p => p.join("\n\n"));
}

const sfx = {
  ctx:null,
  on(){ return store.get("sfx", true); },
  tone(f, t0, d, type="sine", g=.08){
    if (!this.on()) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx, o = c.createOscillator(), v = c.createGain(), s = c.currentTime + t0;
      o.type = type; o.frequency.setValueAtTime(f, s);
      v.gain.setValueAtTime(0, s); v.gain.linearRampToValueAtTime(g, s + .015); v.gain.exponentialRampToValueAtTime(.0001, s + d);
      o.connect(v).connect(c.destination); o.start(s); o.stop(s + d + .05);
    } catch(e) {}
  },
  ok(){ this.tone(660,0,.14,"triangle"); this.tone(990,.09,.22,"triangle"); },
  bad(){ this.tone(220,0,.18,"sawtooth",.05); this.tone(185,.12,.24,"sawtooth",.05); },
  tap(){ this.tone(520,0,.06,"sine",.04); },
  win(){ [523,659,784,1047].forEach((f,i) => this.tone(f, i*.11, .3, "triangle", .07)); }
};

const voice = {
  list:[],
  load(){ try { this.list = speechSynthesis.getVoices(); } catch(e) {} },
  has(lang){ return this.list.some(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase())); },
  say(text, lang){
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = .9;
      const v = this.list.find(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase())); if (v) u.voice = v;

};

function latToCyr(s){
  const d = [["dž","џ"],["Dž","Џ"],["DŽ","Џ"],["lj","љ"],["Lj","Љ"],["LJ","Љ"],["nj","њ"],["Nj","Њ"],["NJ","Њ"],["dj","ђ"],["Dj","Ђ"]];
  d.forEach(([a,b]) => { s = s.split(a).join(b); });
  const m = {a:"а",b:"б",c:"ц",č:"ч",ć:"ћ",d:"д",đ:"ђ",e:"е",f:"ф",g:"г",h:"х",i:"и",j:"ј",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",r:"р",s:"с",š:"ш",t:"т",u:"у",v:"в",z:"з",ž:"ж"};
  return s.replace(/[a-zčćđšž]/gi, ch => { const lo = ch.toLowerCase(), c = m[lo]; return c ? (ch === lo ? c : c.toUpperCase()) : ch; });
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().replace(/[.,!?;:„“"«»¿¡…]/g, "").replace(/\s+/g, " ").trim();
const plain = s => norm(s).normalize("NFD").replace(/[̀-ͯ]/g, "");

        const v = tr(inp.value);
        if (e.answers.some(a => norm(a) === norm(v))) return { ok:true };
        if (e.answers.some(a => plain(a) === plain(v))) return { ok:true, almost:true };
        return { ok:false };
      };
      keyPick = null;
    }
    if (e.type === "match") {
      let left = null, right = null, done = 0, slips = 0;
      const btns = [...stage.querySelectorAll(".ls-opt.m")];
      const tryPair = () => {
        if (left == null || right == null) return;
        const a = btns.find(b => b.dataset.side === "l" && +b.dataset.k === left), b = btns.find(x => x.dataset.side === "r" && +x.dataset.k === right);
        if (left === right) {
          [a, b].forEach(x => { x.classList.remove("sel"); x.classList.add("good"); x.disabled = true; }); sfx.ok(); done++;
          if (canSpeak()) voice.say(a.textContent, SPK);
          if (done === e.pairs.length) setTimeout(() => grade({ ok:true, slips }), 350);
        } else {
          [a, b].forEach(x => { x.classList.remove("sel"); x.classList.add("nope"); setTimeout(() => x.classList.remove("nope"), 450); }); sfx.bad(); slips++;
        }
        left = right = null;
      };
      btns.forEach(b => b.onclick = () => {
        const side = b.dataset.side, k = +b.dataset.k;
        btns.filter(x => x.dataset.side === side).forEach(x => x.classList.toggle("sel", x === b));
        if (side === "l") left = k; else right = k; sfx.tap(); tryPair();
      });
      answerFn = () => ({ ok:true }); keyPick = null;
    }
  }

  const want = e => e.type === "tf" ? +e.answer : e.answer;
  let keyPick = null, graded = false;
  function grade(res){
    if (graded) return; graded = true;
    const foot = document.getElementById("lsFoot"), msg = document.getElementById("lsMsg"), check = document.getElementById("lsCheck");
    document.getElementById("lsSkip").style.display = "none";
    const stage = document.getElementById("lsStage");
    stage.querySelectorAll("button, input").forEach(x => { if (!x.classList.contains("ls-say")) x.disabled = true; });
    const e = cur;
    if (res.ok) {
      S.solved.add(e.k);
      const first = !S.missed.has(e.k) && !(res.slips > 0);
      if (first) { S.firstTry.add(e.k); S.xp += 10; S.streak++; } else { S.xp += 5; S.streak = 0; }
      sfx.ok(); foot.className = "ls-foot ok";
      const praise = T.great[Math.floor(Math.random() * T.great.length)];
      let extra = "";
      if (res.almost) extra = `<div>${T.almost} <b lang="${LL}">${esc(e.answers[0])}</b></div>`;
      else if (e.type === "fill" || e.type === "story") extra = e.es && e.type === "fill" ? `<div class="tr">${esc(e.es)}</div>` : "";
      if (e.why) extra += `<div class="tr">${esc(e.why)}</div>`;
      msg.innerHTML = `<div class="ls-verdict">✔ ${praise}${S.streak >= 3 ? ` <span class="ls-streak">🔥 ${S.streak}</span>` : ""}</div>${extra}`;
      if (res.sel) { res.sel.classList.remove("sel"); res.sel.classList.add("good"); }
    } else {
      S.missed.add(e.k); S.streak = 0;
      if (data.exam) S.solved.add(e.k); else { S.hearts--; S.queue.push(e); }
      sfx.bad(); foot.className = "ls-foot bad";
      const h = document.getElementById("lsHearts"); if (h) { h.classList.remove("hit"); void h.offsetWidth; h.classList.add("hit"); }
      msg.innerHTML = `<div class="ls-verdict">✘ ${T.wrong}</div><div class="sol" lang="${LL}">${esc(solution(e))}</div>${e.type === "fill" && e.es ? `<div class="tr">${esc(e.es)}</div>` : ""}${e.why ? `<div class="tr">${esc(e.why)}</div>` : ""}`;
      if (res.sel) { res.sel.classList.remove("sel"); res.sel.classList.add("bad"); }
      stage.querySelectorAll(".ls-opt[data-k]").forEach(b => { if (+b.dataset.k === want(e) && !b.classList.contains("m")) b.classList.add("good"); });
    }
    progress();
    check.disabled = false; check.textContent = T.next;
    check.onclick = () => { graded = false; next(); };
    check.focus({ preventScroll:true });
  }

  function solution(e){
    if (e.type === "build") return e.answer.join(" ") + ".";
    if (e.type === "write") return e.answers[0];
    if (e.type === "picture") return e.options[e.answer].word;
    if (e.type === "tf") return e.answer ? T.yes : T.no;
    if (e.type === "fill") return `${e.before} ${e.options[e.answer]} ${e.after}`;
    return e.options[e.answer];
  }

  function finish(){
    const secs = Math.round((Date.now() - S.t0) / 1000), acc = Math.round(S.firstTry.size / total * 100);
    const perfect = S.missed.size === 0; if (perfect) S.xp += 20;
    const best = store.get(key, null), score = S.firstTry.size;
    if (!best || S.xp > best.xp || (S.xp === best.xp && acc > best.acc)) store.set(key, { xp:S.xp, acc, score });
    const d = store.get("done:" + KEY, []); if (!d.includes(i)) { d.push(i); store.set("done:" + KEY, d); }
    sfx.win();
    const lvl = data.exam && (data.levels || []).find(l => acc >= l.min);
    const line = lvl ? lvl.text : perfect ? (data.perfect || T.perfect) : acc >= 70 ? (data.good || T.good) : T.ok;
    app.innerHTML = `<section class="ls ls-end">
      <canvas id="lsConfetti" aria-hidden="true"></canvas>
      <div class="ls-mascot jump">${M()}</div>
      <h1>${T.done}</h1>${lvl ? `<div class="ls-kicker">${T.level}</div><h2 class="ls-q">${esc(lvl.title)}</h2>` : ""}<p class="ls-sub">${esc(line)}</p>
      <div class="ls-stats">
        ${data.exam ? `<div class="ls-stat xp"><div class="h">${T.score}</div><div class="v">✔ ${score} / ${total}</div></div>`
                    : `<div class="ls-stat xp"><div class="h">${T.xp}</div><div class="v">⚡ ${S.xp}</div></div>`}
        <div class="ls-stat acc"><div class="h">${T.acc}</div><div class="v">🎯 ${acc}%</div></div>
        <div class="ls-stat tm"><div class="h">${T.time}</div><div class="v">⏱ ${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</div></div>
      </div>
      <button class="ls-btn go" id="lsAgain">${T.again}</button>
      <a class="ls-link" href="${BACK}">${T.back}</a>
    </section>`;
    document.getElementById("lsAgain").onclick = begin;
    confetti(document.getElementById("lsConfetti"));
  }

  function gameover(){
    app.innerHTML = `<section class="ls ls-end lost">
      <div class="ls-mascot">${M("sad")}</div>
      <h1>${T.lost}</h1><p class="ls-sub">${T.lostP}</p>
      <div class="ls-stats"><div class="ls-stat acc"><div class="h">✔</div><div class="v">${S.solved.size} / ${total}</div></div></div>
      <button class="ls-btn go" id="lsAgain">${T.retry}</button>
      <a class="ls-link" href="${BACK}">${T.back}</a>
    </section>`;
    document.getElementById("lsAgain").onclick = begin;
  }

  document.onkeydown = ev => {
    if (!document.querySelector(".ls-play")) return;
    if (ev.key === "Enter") { const b = document.getElementById("lsCheck"); if (b && !b.disabled) { ev.preventDefault(); b.click(); } return; }
    if (!graded && keyPick && /^[1-9]$/.test(ev.key) && document.activeElement.tagName !== "INPUT") keyPick(+ev.key - 1);
  };
  intro();
}

function confetti(cv){
  if (!cv || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  const size = () => { cv.width = cv.offsetWidth * dpr; cv.height = cv.offsetHeight * dpr; };
  size();
  const cols = ["#c8312f","#e0b04a","#4f8a3a","#3b6fb6","#8c2f2f","#f28b82"];
  const P = Array.from({length:140}, () => ({ x:Math.random()*cv.width, y:-Math.random()*cv.height*.6, r:(4+Math.random()*6)*dpr,
    vx:(Math.random()-.5)*2*dpr, vy:(2+Math.random()*3)*dpr, a:Math.random()*6, va:(Math.random()-.5)*.25, c:cols[Math.floor(Math.random()*cols.length)], s:Math.random()<.5 }));
  let f = 0;
  (function tick(){
    if (!document.body.contains(cv)) return;
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += p.va; p.vy += .03*dpr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      if (p.s) ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); else { ctx.beginPath(); ctx.arc(0,0,p.r/2.4,0,7); ctx.fill(); }
      ctx.restore(); });
    if (++f < 260) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

const music = { el:new Audio(), novel:null, i:0, cache:new Map() };

function mTrack(){ return music.novel.soundtrack[music.i]; }
function mSrc(){ return "novels/" + music.novel.slug + "/" + mTrack().file; }
function mLoad(){
  const tk = mTrack();
  if (tk.parts) music.el.removeAttribute("src");
  else music.el.src = mSrc();

function mSync(){
  const b = document.getElementById("mPlay"), on = !music.el.paused;
  b.textContent = on ? "❚❚" : "▶";
  b.setAttribute("aria-label", on ? "Pause" : "Play");
}
async function mPlay(){
  if (!music.novel) return;
  const novel = music.novel, tk = mTrack();
  try {
    if (tk.parts && tk.folder) {
      const key = novel.slug + "/" + tk.folder;
      let audioUrl = music.cache.get(key);
      if (!audioUrl) {
        mStatus.textContent = novel.lang === "ru" ? "Загружаем песню…" : "Loading soundtrack…";
        const audioParts = await Promise.all(Array.from({length:tk.parts}, async (_,i)=>{
          const path = "novels/" + novel.slug + "/" + tk.folder + "/" + String(i).padStart(3,"0") + ".part";
          const res = await fetch(path);
          if (!res.ok) throw new Error("Missing audio part " + i);
          return res.arrayBuffer();
        }));
        audioUrl = URL.createObjectURL(new Blob(audioParts,{type:"audio/mpeg"}));
        music.cache.set(key,audioUrl);
      }
      if (music.novel !== novel || mTrack() !== tk) return;
      if (music.el.src !== audioUrl) music.el.src = audioUrl;
      await music.el.play();
      mStatus.textContent = "";
      return;
    }
    // play() must run inside the click itself: an await before it makes Safari/iOS block playback.
    await music.el.play();
    mStatus.textContent = "";
  } catch(e) {
    if (music.novel !== novel || e.name === "AbortError" || music.el.error) return;
    mStatus.textContent = novel.lang === "ru" ? "Не удалось воспроизвести запись" : "Unable to play audio";
  }
}

  if (!music.novel || i < 0 || i >= music.novel.soundtrack.length) return;

        <span class="date">${!signedIn() && unitLocked(u, c) ? '<span class="lock" aria-hidden="true">🔒</span> ' : ""}${esc(u.level)} · ${esc(lt(h, "unit"))} ${u.n}${best ? ` <span class="pill study">✔ ${esc(lt(h, "done"))} · ${best.acc}%</span>` : ""}</span>
        <h3>${esc(u.title)}</h3>
        <p>${esc(u.sub[h] || "")}</p>
        <span class="more">${esc(lt(h, "go"))}</span>
      </a>`; }).join("")}
    <div class="empty lr-soon">${esc(lt(h, "soon"))}</div>
  </div></section>`;
  bindHelp(learnHome);
}
async function learnUnit(id, practice){
  app.innerHTML = `<div class="loading">…</div>`;
  await loadLearn();
  const c = course(), u = c && c.units.find(x => x.id === id);
  if (c && c.placement && c.placement.id === id) { const p = c.placement, h = learnHelp(c);
    return lesson({slug: "learn/" + c.lang, title: c.title[lang]}, 1, {file: `practice.${h}.json`, title: p.title[h], label: p.title[h]},
      {base: `learn/${c.lang}/${p.id}/`, back: "#/learn", backTitle: c.title[lang], key: `learn/${c.lang}/${p.id}`}); }
  if (!u) { app.innerHTML = `<div class="empty">${esc(t("notFound"))}</div>`; return; }
  if (unitLocked(u, c) && !signedIn()) return loginGate("#/learn");
  const h = learnHelp(c), base = `learn/${c.lang}/${u.id}/`;
  const backT = `${lt(h, "unit")} ${u.n}: ${u.title}`;
  if (practice) return lesson({slug: "learn/" + c.lang, title: c.title[lang]}, 1, {file: `practice.${h}.json`, title: u.title, label: `${u.level} · ${lt(h, "practice")}`},
    {base, back: `#/learn/${u.id}`, backTitle: backT, key: `learn/${c.lang}/${u.id}`});
  let md = "";
  try { md = await getText(base + `theory.${h}.md`); } catch(e) { md = "*—*"; }
  const nv = u.novel && catalog.novels.find(x => x.slug === u.novel);
  document.title = u.title + " — " + c.title[lang];
  app.innerHTML = `
  <div class="reader-bar"><div class="wrap"><a class="crumb" href="#/learn">${esc(lt(h, "back"))}</a></div></div>
  <article class="chapter post lr-theory" lang="${esc(h)}">
    <div class="kicker">${esc(u.level)} · ${esc(lt(h, "unit"))} ${u.n} · ${esc(lt(h, "theory"))}</div>
    <h1 lang="${esc(c.lang)}">${esc(u.title)}</h1>
    ${helpSwitch(c, h)}
    ${nv ? `<p class="lr-novel">${esc(lt(h, "novel"))}: <a href="#/${esc(nv.slug)}">«${esc(nv.title)}»</a></p>` : ""}
    ${renderText(md)}
    <div class="lr-cta"><p>${esc(lt(h, "practiceNote"))}</p><a class="ls-btn go" href="#/learn/${esc(u.id)}/practice">${esc(lt(h, "toPractice"))}</a></div>
  </article>`;
  window.scrollTo(0, 0);
  setupQuizzes(app, h);
  bindHelp(() => learnUnit(id));
}

function route(){
  window.onscroll = null; document.onkeydown = null;
  if (!catalog) return;
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (parts[0] === "news") { setSoundtrack(null); return parts[1] ? newsArticle(decodeURIComponent(parts[1])) : newsIndex(); }
  if (parts[0] === "blog") { setSoundtrack(null); return parts[1] ? blogPost(decodeURIComponent(parts[1])) : blogIndex(); }
  if (parts[0] === "mis-lecturas") { setSoundtrack(null); return myReading(); }
  if (parts[0] === "game") { setSoundtrack(null); return game(); }
  if (parts[0] === "learn") { setSoundtrack(null); return parts[1] ? learnUnit(decodeURIComponent(parts[1]), parts[2] === "practice") : learnHome(); }
  const n = parts.length ? catalog.novels.find(x => x.slug === decodeURIComponent(parts[0])) : null;
  setSoundtrack(n && adultOk(n) ? n : null);
  if (!parts.length) return home();
  if (!n) { app.innerHTML = `<div class="empty">${esc(t("notFound"))}</div>`; return; }
  if (!adultOk(n)) return adultGate(n);
  if (parts[1] === "progreso") return progressPage(n);
  if (parts[1]) {
    const i = chapterIndex(n, decodeURIComponent(parts[1]));
    if (chapterLocked(n, i) && !signedIn()) { if (lang !== n.lang) setLang(n.lang); return loginGate("#/" + n.slug); }
    if (pwLocked(n, i) && !pwOpen(n)) { if (lang !== n.lang) setLang(n.lang); return pwGate(n, i); }
    return reader(n, i, parts[2]);
  }
  novelPage(n);
}
window.addEventListener("hashchange", route);

applyTheme(); renderChrome();
Promise.all([fetch("novels/catalog.json", {cache:"no-cache"}).then(r => r.json()), loadLearn(), loadNews()]).then(([j]) => { catalog = j; route(); })
  .catch(() => { catalog = {novels:[]}; route(); });

/* Glosses: **palabra**{перевод} shows the translation on hover, focus or tap */
(function(){
  let tip = null, cur = null, shownAt = 0, ptr = false;
  function show(el){
    if (!tip){ tip = document.createElement("div"); tip.id = "glossTip"; tip.setAttribute("role","tooltip"); document.body.appendChild(tip); }
    if (cur !== el) shownAt = Date.now(); cur = el; const pr = el.dataset.tr.split("|");
    const pk = el.closest("[data-pick]");
    if (pk && pr.length > 1){ const gl = pk.dataset.gl.split(","), i = Math.max(0, gl.indexOf(pk.dataset.pick)); tip.textContent = (pr[i] || pr[0]).trim(); }
    else if (pr.length > 1){ tip.innerHTML = ""; const art = el.closest("[data-gl]"), gl = art ? art.dataset.gl.split(",") : ["RU","EN","SR"];
      pr.map((v,i) => { const m = v.match(/^\s*([A-Z]{2,3}):\s*([\s\S]*)$/); return m ? [m[1], m[2]] : [gl[i] || "", v]; }).filter(([,v]) => v && v.trim()).forEach(([k,v]) => { const d = document.createElement("div"); const b = document.createElement("b"); b.textContent = k; d.append(b, " " + v.trim()); tip.appendChild(d); }); }
    else tip.textContent = el.dataset.tr;
    tip.classList.add("on");
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = r.left + r.width/2 - w/2; x = Math.max(12, Math.min(x, innerWidth - w - 12));
    let y = r.top - h - 8; if (y < 70) y = r.bottom + 8;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hide(){ if (tip) tip.classList.remove("on"); cur = null; }
  const g = e => e.target.closest && e.target.closest(".gloss");
  document.addEventListener("pointerover", e => { if (e.pointerType !== "mouse") return; const el = g(e); if (el) show(el); });
  document.addEventListener("pointerout", e => { if (e.pointerType === "mouse" && g(e) && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".gloss") === cur)) hide(); });
  document.addEventListener("pointerdown", () => { ptr = true; setTimeout(() => ptr = false, 500); }, true);
  document.addEventListener("focusin", e => { const el = g(e); if (el && !ptr) show(el); });
  document.addEventListener("focusout", e => { if (g(e)) hide(); });
  document.addEventListener("click", e => { const el = g(e); if (el){ if (cur === el && tip.classList.contains("on") && Date.now() - shownAt > 350) hide(); else show(el); } else hide(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") hide(); });
  addEventListener("scroll", hide, {passive:true});
  addEventListener("resize", hide);
})();
</script>
