const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const pwLocked = (n, i) => !!(n && n.lock) && i > (n.lock.free || 0);
const pwKeys = {};
async function pwKey(n){
  if (!n || !n.lock) throw new Error("no key");
  if (pwKeys[n.slug]) return pwKeys[n.slug];
  const raw = store.get("pw:" + n.slug, null); if (!raw) throw new Error("no key");
  return pwKeys[n.slug] = await crypto.subtle.importKey("raw", b64d(raw), "AES-GCM", true, ["decrypt"]);
}
async function pwDecrypt(s, key){
  const b = b64d(s.slice(PW_MARK.length).trim());
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b.subarray(0,12)}, key, b.subarray(12)));
}
async function pwDerive(n, pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:b64d(n.lock.salt), iterations:n.lock.iter || 250000},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
const pwOpen = n => !!(n && n.lock) && store.get("pw:" + n.slug, null) !== null;
function pwGate(n, i){
  const T = PW_T[n.lang] || PW_T.en;
  document.title = T[0] + " · " + n.title;
  app.innerHTML = `<section class="wrap gate"><div class="lock-big" aria-hidden="true">🔒</div>
    <h1>${esc(T[0])}</h1><p>${esc(T[1])}</p>

    <button class="btn" type="submit">${esc(T[3])}</button></form>
    <div class="pw-err" id="pwErr" role="alert"></div>
    <a class="btn ghost" href="#/${esc(n.slug)}">${esc(T[5])}</a></section>`;
  const inp = document.getElementById("pwIn"), err = document.getElementById("pwErr");
  inp.focus();
  document.getElementById("pwForm").onsubmit = async e => {
    e.preventDefault(); err.textContent = "…";
    try {
      const key = await pwDerive(n, inp.value);
      const r = await fetch(`novels/${n.slug}/${n.chapters[i-1].file}`); const s = await r.text();
      if (s.startsWith(PW_MARK)) await pwDecrypt(s, key);
      store.set("pw:" + n.slug, b64e(await crypto.subtle.exportKey("raw", key)));
      pwKeys[n.slug] = key; route();
    } catch(x) { err.textContent = T[4]; inp.value = ""; inp.focus(); }
  };
  window.scrollTo(0, 0);
}

const SAGA_W = {vec:"Saga",ru:"Цикл", es:"Saga", it:"Saga", en:"Series", de:"Reihe", fr:"Saga", tr:"Seri", pt:"Saga", cs:"Série", pl:"Cykl", sr:"Серијал", eo:"Serio", isv:"Serija", vo:"Saga", ia:"Serie", ld:"Seria"};
function sagaHTML(n){
  const all = catalog.series || [], bySlug = Object.fromEntries(catalog.novels.map(x => [x.slug, x]));
  const mine = new Set([n.slug, ...Object.values(n.translations || {})]);
  return all.filter(s => s.novels.some(m => mine.has(m) || Object.values((bySlug[m]||{}).translations || {}).some(x => mine.has(x)))).map(s => {
    const parallelUniverses = s.id === "predchuvstvie";
    const seen = new Set();
    const items = s.novels.map(m => {
      let x = bySlug[m]; if (!x) return null;
      // Other sagas show the reader's language where a translation exists.
      // Turquoise Fortress novels are independent alternate universes, not duplicates.
      if (!parallelUniverses && x.lang !== n.lang && x.translations && x.translations[n.lang] && bySlug[x.translations[n.lang]]) x = bySlug[x.translations[n.lang]];
      if (seen.has(x.slug)) return null; seen.add(x.slug);
      const cur = parallelUniverses ? x.slug === n.slug : mine.has(x.slug) || mine.has(m);
      return `<a href="#/${esc(x.slug)}" class="${cur ? "cur" : ""}">${coverHTML(x)}${esc(x.title)}${parallelUniverses || x.lang !== n.lang ? `<small>${esc(LANG_NAMES[x.lang] || x.lang)}</small>` : ""}</a>`;
    }).filter(Boolean);
    if (items.length < 2) return "";
    const name = s.name[n.lang] || s.name["*"];
    const description = parallelUniverses ? (s.description?.[n.lang] || s.description?.["*"] || "") : "";
    return `<div class="saga"><h2>${esc(SAGA_W[n.lang] || "Saga")} · ${esc(name)}</h2>${description ? `<p class="saga-description">${esc(description)}</p>` : ""}<div class="row">${items.join("")}</div></div>`;
  }).join("");
}

function moduleProgress(n){

  const modules=titles.map((title,i)=>{

    const index=n.chapters.findIndex(c=>c.file===file)+1;
    const raw=store.get("module-best:"+n.slug+":"+file,null);
    const score=typeof raw==="number"&&Number.isFinite(raw)?Math.min(100,Math.max(0,raw)):null;
    return {title,index,score};
  });
  const completed=modules.filter(m=>m.score!==null);
  const average=completed.length?Math.round(completed.reduce((v,m)=>v+m.score,0)/completed.length):null;
  const rows=modules.map((m,i)=>'<div style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)"><div><strong>Módulo '+(i+1)+': '+esc(m.title)+'</strong><div style="opacity:.8;font-size:.9em">'+(m.score===null?'Pendiente':('Mejor nota: '+m.score+' / 100'))+'</div></div><a class="btn ghost" href="#/'+esc(n.slug)+'/'+m.index+'">'+(m.score===null?'Empezar':'Repetir')+'</a></div>').join("");

}

function cpBoard(fen, flip, mv){
  const B = {};
  fen.split(" ")[0].split("/").forEach((row, i) => { let f = 0; for (const c of row) { if (/\d/.test(c)) f += +c; else { B["abcdefgh"[f] + (8 - i)] = c; f++; } } });
  let hl = [];
  if (mv) { const a = mv.slice(0, 2), b = mv.slice(2, 4); let pc = B[a]; if (mv[4] && pc) pc = pc === pc.toUpperCase() ? mv[4].toUpperCase() : mv[4]; delete B[a]; B[b] = pc; hl = [a, b]; }
  let h = "";
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const file = flip ? 7 - c : c, rank = flip ? r + 1 : 8 - r, sq = "abcdefgh"[file] + rank, pc = B[sq];
    h += `<div class="cp-sq${(file + rank) % 2 ? " d" : ""}${hl.includes(sq) ? " hl" : ""}">`
      + (pc ? `<span class="cp-pc ${pc === pc.toUpperCase() ? "w" : "b"}">${CP_GLYPH[pc.toLowerCase()]}</span>` : "")
      + (r === 7 ? `<span class="cp-co f">${"abcdefgh"[file]}</span>` : "") + (c === 0 ? `<span class="cp-co r">${rank}</span>` : "") + `</div>`;
  }
  return `<div class="cp-board" role="img" aria-label="${esc(fen.split(" ")[0])}">${h}</div>`;
}
function exQuizRun(n, sec, D, pane, kind){
  const U = D.ui || {}, items = kind === "chess" ? D.puzzles : D.questions, N = items.length, key = (kind === "chess" ? "cpz:" : "trv:") + n.slug;
  let i = 0, sc = 0;
  const draw = () => {
    if (!pane.isConnected) return;
    if (i >= N) {
      const v = (U.verdicts || []).slice().sort((a, b) => b.min - a.min).find(v => sc >= v.min);
      const best = Math.max(sc, +store.get(key, 0) || 0); store.set(key, best);
      pane.innerHTML = `<div class="ex-qz"><div class="qv"><div class="qi" aria-hidden="true">${kind === "chess" ? "♞" : "♛"}</div>${v ? `<h3>${esc(v.title)}</h3><p>${esc(v.text)}</p>` : ""}<small>${esc(qzFmt(U.score, {s: sc, N}))}</small><button type="button" class="qr">${esc(U.again || "↻")}</button></div></div>`;
      pane.querySelector(".qr").onclick = () => { i = 0; sc = 0; draw(); };
      return;
    }
    const x = items[i];
    const opts = qzShuf(kind === "chess" ? x.options.map((o, k) => ({t: o.san, k})) : x.a.map((t, k) => ({t, k})));
    const lvl = kind === "chess" ? `<span class="cp-lv l${Math.min(4, Math.floor(i / Math.max(1, N / 5)))}">${esc(x.level || "")}</span>` : "";
    pane.innerHTML = `<div class="ex-qz${kind === "chess" ? " ex-cp" : ""}">${i === 0 ? `<h3>${esc(D.title || sec.title)}</h3><p class="ex-p">${esc(D.intro || "")}</p>` : ""}
      <div class="qhd"><p class="qn">${esc(qzFmt(U.of, {n: i + 1, N}))}</p>${lvl}</div><div class="qbar"><i style="width:${i / N * 100}%"></i></div>
      ${kind === "chess" ? `<h3 class="cp-name">${esc(x.name || "")}</h3><p class="qq">${esc(x.goal)}</p><div class="cp-wrap">${cpBoard(x.fen, x.flip)}</div>` : `<p class="qq">${esc(x.q)}</p>`}
      <div class="qa">${opts.map(o => `<button type="button" data-k="${o.k}">${esc(o.t)}</button>`).join("")}</div><div class="qfb" hidden></div></div>`;
    pane.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === x.answer; if (ok) sc++;
      pane.querySelectorAll("[data-k]").forEach(o => { o.disabled = true; const kk = +o.dataset.k; o.classList.add(kk === x.answer ? "ok" : kk === k ? "no" : "dim"); });
      if (kind === "chess") pane.querySelector(".cp-wrap").innerHTML = cpBoard(x.fen, x.flip, x.options[x.answer].uci);
      const right = kind === "chess" ? x.options[x.answer].san : x.a[x.answer];
      const fb = pane.querySelector(".qfb"); fb.hidden = false;
      fb.innerHTML = `<b class="${ok ? "ok" : "no"}">${esc(ok ? U.right || "✓" : U.wrong || "✗")}</b>${ok ? "" : `<p>${esc(qzFmt(U.correct, {m: right, a: right}))}</p>`}${x.explain ? `<p>${esc(x.explain)}</p>` : ""}<button type="button" class="qr">${esc(i + 1 < N ? U.next || "→" : U.finish || "→")}</button>`;
      fb.querySelector(".qr").onclick = () => { i++; draw(); pane.scrollIntoView({block: "nearest"}); };
    });
  };
  draw();
}

async function exQuiz(n, pane, T){
  pane.innerHTML = `<div class="loading">…</div>`;
  let q = null;
  try { q = await (await fetch(`novels/${n.slug}/quiz.json`, {cache:"no-cache"})).json(); } catch(e) {}
  if (!pane.isConnected || !q) return;
  const max = q.questions.reduce((m, x) => m + Math.max(...x.a.map(a => a.s)), 0);
  let i = 0, sc = 0;
  const draw = () => {
    if (!pane.isConnected) return;
    if (i >= q.questions.length) {
      const v = q.verdicts.slice().sort((a, b) => b.min - a.min).find(v => sc >= v.min) || q.verdicts[q.verdicts.length - 1];
      store.set("quiz:" + n.slug, sc);
      pane.innerHTML = `<div class="ex-qz"><div class="qv"><div class="qi" aria-hidden="true">${esc(v.icon || "")}</div><h3>${esc(v.title)}</h3><p>${esc(v.text)}</p><small>${esc(T.qPts(sc, max))}</small><button type="button" class="qr">${esc(T.qAgain)}</button></div></div>`;
      pane.querySelector(".qr").onclick = () => { i = 0; sc = 0; draw(); };
      return;
    }
    const x = q.questions[i], N = q.questions.length;
    pane.innerHTML = `<div class="ex-qz">${i === 0 ? `<h3>${esc(q.title)}</h3><p class="ex-p">${esc(q.intro)}</p>` : ""}
      <p class="qn">${esc(T.qOf(i + 1, N))}</p><div class="qbar"><i style="width:${i / N * 100}%"></i></div>
      <p class="qq">${esc(x.q)}</p><div class="qa">${x.a.map((a, k) => `<button type="button" data-a="${k}">${esc(a.t)}</button>`).join("")}</div></div>`;
    pane.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { sc += x.a[+b.dataset.a].s; i++; draw(); });
  };
  draw();
}

function exLightbox(n, list, i, T, title){
  const lb = document.createElement("div"); lb.className = "ex-lb"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true");
  const draw = () => { const o = list[i]; lb.innerHTML = `<button type="button" class="ex-x" aria-label="${esc(T.close)}">✕</button>
    ${i > 0 ? `<button type="button" class="ex-nav prev" aria-label="←">‹</button>` : ""}${i < list.length - 1 ? `<button type="button" class="ex-nav next" aria-label="→">›</button>` : ""}
    <figure><img src="novels/${n.slug}/${o.src}" alt=""><figcaption>${esc(T.ch)} ${o.ch} · ${esc(title(o.ch))} <a href="${chapterHref(n, o.ch)}">→</a></figcaption></figure>`;
    lb.querySelector(".ex-x").onclick = close; const p = lb.querySelector(".prev"), q = lb.querySelector(".next");
    if (p) p.onclick = e => { e.stopPropagation(); i--; draw(); }; if (q) q.onclick = e => { e.stopPropagation(); i++; draw(); };
    lb.querySelector("figcaption a").onclick = close; };
  const key = e => { if (e.key === "Escape") close(); else if (e.key === "ArrowLeft" && i > 0) { i--; draw(); } else if (e.key === "ArrowRight" && i < list.length - 1) { i++; draw(); } };
  function close(){ lb.remove(); document.removeEventListener("keydown", key); document.body.style.overflow = ""; }
  lb.onclick = e => { if (e.target === lb || e.target.tagName === "FIGURE") close(); };
  let x0 = null; lb.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
  lb.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (dx > 50 && i > 0) { i--; draw(); } else if (dx < -50 && i < list.length - 1) { i++; draw(); } });
  draw(); document.body.appendChild(lb); document.addEventListener("keydown", key); document.body.style.overflow = "hidden";
}

/* ───────── Long chapters are shown as pages of ~PAGE_CHARS characters ───────── */
const PAGE_CHARS = 6000, PAGE_MIN_LAST = 1500;
const PAGE_WORD = {vec:"Pàxena",ru:"Страница",es:"Página",it:"Pagina",en:"Page",de:"Seite",fr:"Page",tr:"Sayfa",pt:"Página",cs:"Strana",pl:"Strona",sr:"Strana",eo:"Paĝo",la:"Pagina",sw:"Ukurasa",ia:"Pagina",bg:"Страница",uk:"Сторінка"};
function splitPages(md){
  const manual = md.split(/\n[ \t]*<!--\s*pagebreak\s*-->[ \t]*(?:\n|$)/i);
  if (manual.length > 1) return manual;
  if (/\[\[|^\{=/m.test(md)) return [md];                      // interactive blocks stay together
  const blocks = md.replace(/\r/g,"").split(/\n\s*\n/).filter(b => b.trim());
  const isImg = b => /^\[?!\[/.test(b.trim());
  const len = b => isImg(b) ? 0 : b.length;
  if (blocks.reduce((s,b) => s + len(b), 0) <= PAGE_CHARS + PAGE_MIN_LAST) return [md];
  const pages = []; let cur = [], size = 0;
  for (const b of blocks) {
    if (size >= PAGE_CHARS && !isImg(b)) {
      const carry = []; while (cur.length && isImg(cur[cur.length-1])) carry.unshift(cur.pop());  // keep a picture with the text after it
      pages.push(cur); cur = carry; size = 0;
    }
    cur.push(b); size += len(b);
  }
  if (cur.length) { const s = cur.reduce((x,b) => x + len(b), 0);
    if (pages.length && s < PAGE_MIN_LAST) pages[pages.length-1].push(...cur); else pages.push(cur); }
  return pages.map(p => p.join("\n\n"));
}
function resumeHref(n, i){ const pg = store.get("pg:" + n.slug, null); return chapterHref(n, i) + (pg && pg.i === i && pg.p > 1 ? "/" + pg.p : ""); }

/* Mobile browsers (Safari, Chrome on Android) can restore the old scroll position after a hash
   navigation or keep a momentum scroll running, so a single scrollTo(0,0) may be undone and the
   next page opens at its bottom. Jump to the top now and again over the next frames. */
try { history.scrollRestoration = "manual"; } catch(e) {}
function toTop(){
  const go = () => { window.scrollTo(0, 0); const se = document.scrollingElement || document.documentElement; if (se) se.scrollTop = 0; document.body.scrollTop = 0; };
  go(); requestAnimationFrame(() => { go(); requestAnimationFrame(go); });
  let moved = false; const stop = () => { moved = true; };
  addEventListener("touchstart", stop, {once:true, passive:true}); addEventListener("wheel", stop, {once:true, passive:true});
  [60, 200, 450].forEach(ms => setTimeout(() => { if (!moved) go(); }, ms));
  setTimeout(() => { removeEventListener("touchstart", stop); removeEventListener("wheel", stop); }, 500);
}

const sfx = {
  ctx:null,
  on(){ return store.get("sfx", true); },
  tone(f, t0, d, type="sine", g=.08){
    if (!this.on()) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx, o = c.createOscillator(), v = c.createGain(), s = c.currentTime + t0;
      o.type = type; o.frequency.setValueAtTime(f, s);
      v.gain.setValueAtTime(0, s); v.gain.linearRampToValueAtTime(g, s + .015); v.gain.exponentialRampToValueAtTime(.0001, s + d);
      o.connect(v).connect(c.destination); o.start(s); o.stop(s + d + .05);
    } catch(e) {}
  },
  ok(){ this.tone(660,0,.14,"triangle"); this.tone(990,.09,.22,"triangle"); },
  bad(){ this.tone(220,0,.18,"sawtooth",.05); this.tone(185,.12,.24,"sawtooth",.05); },
  tap(){ this.tone(520,0,.06,"sine",.04); },
  win(){ [523,659,784,1047].forEach((f,i) => this.tone(f, i*.11, .3, "triangle", .07)); }
};

const voice = {
  list:[],
  load(){ try { this.list = speechSynthesis.getVoices(); } catch(e) {} },
  has(lang){ return this.list.some(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase())); },

      const v = this.list.find(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase())); if (v) u.voice = v;

function latToCyr(s){
  const d = [["dž","џ"],["Dž","Џ"],["DŽ","Џ"],["lj","љ"],["Lj","Љ"],["LJ","Љ"],["nj","њ"],["Nj","Њ"],["NJ","Њ"],["dj","ђ"],["Dj","Ђ"]];
  d.forEach(([a,b]) => { s = s.split(a).join(b); });
  const m = {a:"а",b:"б",c:"ц",č:"ч",ć:"ћ",d:"д",đ:"ђ",e:"е",f:"ф",g:"г",h:"х",i:"и",j:"ј",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",r:"р",s:"с",š:"ш",t:"т",u:"у",v:"в",z:"з",ž:"ж"};
  return s.replace(/[a-zčćđšž]/gi, ch => { const lo = ch.toLowerCase(), c = m[lo]; return c ? (ch === lo ? c : c.toUpperCase()) : ch; });
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().replace(/[.,!?;:„“"«»¿¡…]/g, "").replace(/\s+/g, " ").trim();

        <div class="ls-list">${e._opts.map((x, j) => `<button class="ls-opt row" data-k="${x.k}"><kbd>${j+1}</kbd><span lang="${LL}">${esc(x.o)}</span></button>`).join("")}</div>`;

        <input class="ls-input" id="lsIn" lang="${LL}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${T.type}">

  function bind(e, stage){

      let sel = null;

      opts.forEach(b => b.onclick = () => {
        opts.forEach(x => x.classList.toggle("sel", x === b)); sel = +b.dataset.k; sfx.tap(); ready(true);
        if (e.type === "reverse" && canSpeak()) voice.say(b.textContent.replace(/^\d/, ""), SPK);
      });

        bank.querySelectorAll(".ls-chip").forEach(b => b.classList.toggle("used", picked.includes(+b.dataset.k)));
        ans.querySelectorAll(".ls-chip").forEach(b => b.onclick = () => { picked.splice(+b.dataset.j, 1); sfx.tap(); redraw(); });
        ready(picked.length > 0);
      };
      bank.querySelectorAll(".ls-chip").forEach(b => b.onclick = () => { const k = +b.dataset.k; if (picked.includes(k)) return; picked.push(k); sfx.tap(); redraw(); });
      answerFn = () => {
        const said = picked.map(k => e._bank.find(x => x.k === k).w).join(" ");
        return { ok: norm(said) === norm(e.answer.join(" ")) };
      };
      keyPick = null;
    }
    if (e.type === "write") {
      const inp = stage.querySelector("#lsIn");
      inp.oninput = () => ready(inp.value.trim().length > 0);
      stage.querySelectorAll(".ls-key").forEach(b => b.onclick = () => {

      answerFn = () => {
        const v = tr(inp.value);
        if (e.answers.some(a => norm(a) === norm(v))) return { ok:true };
        if (e.answers.some(a => plain(a) === plain(v))) return { ok:true, almost:true };
        return { ok:false };
      };
      keyPick = null;
    }
    if (e.type === "match") {
      let left = null, right = null, done = 0, slips = 0;
      const btns = [...stage.querySelectorAll(".ls-opt.m")];
      const tryPair = () => {
        if (left == null || right == null) return;
        const a = btns.find(b => b.dataset.side === "l" && +b.dataset.k === left), b = btns.find(x => x.dataset.side === "r" && +x.dataset.k === right);
        if (left === right) {
          [a, b].forEach(x => { x.classList.remove("sel"); x.classList.add("good"); x.disabled = true; }); sfx.ok(); done++;
          if (canSpeak()) voice.say(a.textContent, SPK);
          if (done === e.pairs.length) setTimeout(() => grade({ ok:true, slips }), 350);
        } else {
          [a, b].forEach(x => { x.classList.remove("sel"); x.classList.add("nope"); setTimeout(() => x.classList.remove("nope"), 450); }); sfx.bad(); slips++;
        }
        left = right = null;
      };
      btns.forEach(b => b.onclick = () => {
        const side = b.dataset.side, k = +b.dataset.k;
        btns.filter(x => x.dataset.side === side).forEach(x => x.classList.toggle("sel", x === b));
        if (side === "l") left = k; else right = k; sfx.tap(); tryPair();
      });

  const want = e => e.type === "tf" ? +e.answer : e.answer;
  let keyPick = null, graded = false;
  function grade(res){
    if (graded) return; graded = true;
    const foot = document.getElementById("lsFoot"), msg = document.getElementById("lsMsg"), check = document.getElementById("lsCheck");
    document.getElementById("lsSkip").style.display = "none";
    const stage = document.getElementById("lsStage");
    stage.querySelectorAll("button, input").forEach(x => { if (!x.classList.contains("ls-say")) x.disabled = true; });
    const e = cur;
    if (res.ok) {
      S.solved.add(e.k);
      const first = !S.missed.has(e.k) && !(res.slips > 0);
      if (first) { S.firstTry.add(e.k); S.xp += 10; S.streak++; } else { S.xp += 5; S.streak = 0; }
      sfx.ok(); foot.className = "ls-foot ok";
      const praise = T.great[Math.floor(Math.random() * T.great.length)];

      else if (e.type === "fill" || e.type === "story") extra = e.es && e.type === "fill" ? `<div class="tr">${esc(e.es)}</div>` : "";
      if (e.why) extra += `<div class="tr">${esc(e.why)}</div>`;

      if (res.sel) { res.sel.classList.remove("sel"); res.sel.classList.add("good"); }

      S.missed.add(e.k); S.streak = 0;

    app.innerHTML = `<section class="ls ls-end">
      <canvas id="lsConfetti" aria-hidden="true"></canvas>

      </div>
      <button class="ls-btn go" id="lsAgain">${T.again}</button>
      <a class="ls-link" href="${BACK}">${T.back}</a>

    app.innerHTML = `<section class="ls ls-end lost">

function confetti(cv){
  if (!cv || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  const size = () => { cv.width = cv.offsetWidth * dpr; cv.height = cv.offsetHeight * dpr; };
  size();
  const cols = ["#c8312f","#e0b04a","#4f8a3a","#3b6fb6","#8c2f2f","#f28b82"];
  const P = Array.from({length:140}, () => ({ x:Math.random()*cv.width, y:-Math.random()*cv.height*.6, r:(4+Math.random()*6)*dpr,
    vx:(Math.random()-.5)*2*dpr, vy:(2+Math.random()*3)*dpr, a:Math.random()*6, va:(Math.random()-.5)*.25, c:cols[Math.floor(Math.random()*cols.length)], s:Math.random()<.5 }));
  let f = 0;
  (function tick(){
    if (!document.body.contains(cv)) return;
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += p.va; p.vy += .03*dpr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      if (p.s) ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); else { ctx.beginPath(); ctx.arc(0,0,p.r/2.4,0,7); ctx.fill(); }
      ctx.restore(); });
    if (++f < 260) requestAnimationFrame(tick); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

  function capturedBy(color){

      if (game.over === "won") { const w = store.get("chess:wins", {}); w[game.level] = (w[game.level] || 0) + 1; store.set("chess:wins", w); }

    if (!game || game.over || pos.side === myColor() || pending) return;

  }
  function ask(level, cb){
    const id = ++reqId, t0 = Date.now(), moves = game.moves.slice();
    busy++; pending = {id, cb, t0}; drawSides(); drawStatus(); drawTools();
    if (worker) worker.postMessage({id, moves, level});
    else setTimeout(() => { const p = C.fromMoves(moves), m = C.bestMove(p, level); onEngine({id, move: m ? C.uci(m) : null}); }, 60);
  }
  function onEngine(d){
    if (!pending || d.id !== pending.id) return;
    const {cb, t0} = pending, wait = Math.max(0, 420 - (Date.now() - t0));

  }
  function cancelEngine(){ pending = null; busy = 0; }

  /* ---------- Events (bound on every render of the page) ---------- */
  function bind(){
    $("czSetup").addEventListener("click", e => {
      const a = e.target.closest(".cz-army");
      if (a && !a.disabled) { cfg[a.dataset.which] = a.dataset.id; store.set("chess:cfg", cfg); drawSetup(); return; }
      const l = e.target.closest("[data-level]"); if (l) { cfg.level = +l.dataset.level; store.set("chess:cfg", cfg); drawSetup(); return; }
      const c = e.target.closest("[data-color]"); if (c) { cfg.color = c.dataset.color; store.set("chess:cfg", cfg); drawSetup(); }

    $("czStart").onclick = () => newGame();
    $("czResume").onclick = () => { const g = store.get("chess:game", null); if (g) startGame(g); };
    $("czChange").onclick = $("czNew").onclick = () => { cancelEngine(); game = null; drawSetup(); window.scrollTo(0, 0); };
    $("czRematch").onclick = () => newGame(game.me === "w" ? "b" : "w");
    $("czPromoModal").addEventListener("click", e => { if (e.target.id === "czPromoModal") { $("czPromoModal").classList.add("cz-hide"); select(-1); } });
    $("czHint").onclick = () => { if (canMove()) ask(4, mv => { const m = mv && C.fromUci(pos, mv); if (m) { hintMv = m; sel = -1; targets = []; render(); } }); };
    $("czUndo").onclick = () => {
      cancelEngine();
      const mine = i => (i % 2 === 0) === (game.me === "w");
      while (game.moves.length && !mine(game.moves.length - 1)) game.moves.pop();  // the computer's reply
      if (game.moves.length) game.moves.pop();                                      // my move

      const b = e.target.closest(".cz-sq"); if (!b || !game) return;
      const sq = +b.dataset.sq, p = pos.b[sq];
      if (!canMove()) { selInfo(sq); return; }
      if (sel >= 0 && sq !== sel && targets.some(m => C.to(m) === sq)) { tryMove(sel, sq); return; }
      if (p && (p & C.BLACK) === myColor()) {
        const wasSel = sel === sq;
        if (!wasSel) select(sq);

        board.setPointerCapture(e.pointerId);
      } else if (sel >= 0) select(-1); else selInfo(sq);
    });
    board.addEventListener("pointermove", e => {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.ghost && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
        const src = board.querySelector(`[data-sq="${drag.sq}"] .cz-pc`); if (!src) return;

        g.classList.add("cz-drag"); g.style.width = g.style.height = size + "px"; document.body.appendChild(g);
        src.style.opacity = ".25"; drag.ghost = g;
      }
      if (drag.ghost) { drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px"; }
    });
    const end = e => {
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag; drag = null;
      if (!d.ghost) { if (d.wasSel) select(-1); return; }
      d.ghost.remove();
      const el = document.elementFromPoint(e.clientX, e.clientY), b = el && el.closest && el.closest(".cz-sq");
      const to = b ? +b.dataset.sq : -1;
      if (to >= 0 && to !== d.sq && tryMove(d.sq, to)) return;
      render(); selInfo(sel);
    };
    board.addEventListener("pointerup", end);

const auCache = new Map();
document.addEventListener("click", async e => {
  const btn = e.target.closest && e.target.closest("figure.au-parts .au-go"); if (!btn) return;
  const fig = btn.closest("figure"), au = fig.querySelector("audio"), st = fig.querySelector(".au-st"), folder = fig.dataset.folder, n = +fig.dataset.n;
  const T = {ru:["Загрузка…","Не удалось загрузить песню"], it:["Carico la canzone…","Impossibile caricare la canzone. Riprova."], en:["Loading the song…","Couldn't load the song. Try again."]}[lang] || ["Cargando la canción…","No se pudo cargar la canción. Probá de nuevo."];
  btn.disabled = true; st.textContent = T[0];
  try {
    let url = auCache.get(folder);
    if (!url) {
      const parts = await Promise.all(Array.from({length:n}, async (_, i) => { const r = await fetch(audioUrl(folder + "/" + String(i).padStart(3, "0") + ".part")); if (!r.ok) throw new Error("part " + i); return r.arrayBuffer(); }));
      url = URL.createObjectURL(new Blob(parts, {type:"audio/mpeg"})); auCache.set(folder, url);
    }
    au.src = url; au.hidden = false; btn.hidden = true; st.textContent = "";
    try { await au.play(); } catch (err) {}
  } catch (err) { btn.disabled = false; st.textContent = T[1]; }
});
music.el.preload = "none";
music.el.volume = store.get("vol", 0.5);
const mStatus = document.getElementById("mStatus");
const mSelect = document.getElementById("mTrackSelect");
function mTrack(){ return music.novel.soundtrack[music.i]; }
function mSrc(){ return new URL("novels/" + music.novel.slug + "/" + mTrack().file, AUDIO_BASE).href; }
function mLoad(){
  const tk = mTrack();
  if (tk.parts) music.el.removeAttribute("src");
  else music.el.src = mSrc();
  document.getElementById("mTitle").innerHTML = "♪ <b>" + esc(tk.title) + "</b>";
  mSelect.value = String(music.i);
  mStatus.textContent = "";
  mSync();
}
function mSync(){
  const b = document.getElementById("mPlay"), on = !music.el.paused;
  b.textContent = on ? "❚❚" : "▶";
  b.setAttribute("aria-label", on ? "Pause" : "Play");
}
async function mPlay(){
  if (!music.novel) return;
  const novel = music.novel, tk = mTrack();
  try {
    if (tk.parts && tk.folder) {
      const key = novel.slug + "/" + tk.folder;
      let audioUrl = music.cache.get(key);
      if (!audioUrl) {
        mStatus.textContent = stText(novel.lang).loading;
        const audioParts = await Promise.all(Array.from({length:tk.parts}, async (_,i)=>{
          const path = "novels/" + novel.slug + "/" + tk.folder + "/" + String(i).padStart(3,"0") + ".part";
          const res = await fetch(audioUrl(path));
          if (!res.ok) throw new Error("Missing audio part " + i);
          return res.arrayBuffer();
        }));
        audioUrl = URL.createObjectURL(new Blob(audioParts,{type:"audio/mpeg"}));
        music.cache.set(key,audioUrl);
      }
      if (music.novel !== novel || mTrack() !== tk) return;
      if (music.el.src !== audioUrl) music.el.src = audioUrl;
      await music.el.play();
      mStatus.textContent = "";
      return;
    }
    // play() must run inside the click itself: an await before it makes Safari/iOS block playback.
    await music.el.play();
    mStatus.textContent = "";
  } catch(e) {
    if (music.novel !== novel || e.name === "AbortError" || music.el.error) return;
    mStatus.textContent = stText(novel.lang).fail;
  }
}
function mChoose(i, start){
  if (!music.novel || i < 0 || i >= music.novel.soundtrack.length) return;
  const was = !music.el.paused;
  music.el.pause();
  music.i = i;
  mLoad();
  if (start || was) mPlay();
}
function setSoundtrack(n){
  const box = document.getElementById("music"), has = n && n.soundtrack && n.soundtrack.length;
  if (music.novel && (!has || music.novel.slug !== n.slug)) {
    music.el.pause(); music.el.removeAttribute("src"); music.novel = null;
  }
  if (!has){ box.classList.remove("on"); mStatus.textContent = ""; return; }
  if (!music.novel){
    music.novel = n; music.i = 0;
    mSelect.innerHTML = n.soundtrack.map((tk,i) => '<option value="' + i + '">' + esc(tk.title) + '</option>').join("");
    mLoad();
  }
  box.classList.add("on"); mSync();
}
document.getElementById("mPlay").onclick = () => { music.el.paused ? mPlay() : music.el.pause(); };
document.getElementById("mNext").onclick = () => mChoose((music.i+1) % music.novel.soundtrack.length, false);
mSelect.onchange = () => mChoose(+mSelect.value, false);
music.el.onended = () => mChoose((music.i+1) % music.novel.soundtrack.length, true);
music.el.onplay = music.el.onpause = mSync;
music.el.onerror = () => {
  if (!music.novel || !music.el.getAttribute("src")) return;
  const ru = music.novel.lang === "ru", missing = music.el.error && music.el.error.code === 4;
  mStatus.textContent = missing ? (ru ? "Аудиозапись ещё не опубликована" : "Audio file not yet available") : (ru ? "Не удалось загрузить аудиофайл" : "Audio file unavailable");
  music.el.pause(); mSync();
};

function route(){
  window.onscroll = null; document.onkeydown = null;
  if (!catalog) return;
  renderSiteNav();
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (parts[0] === "news") { setSoundtrack(null); return parts[1] ? newsArticle(decodeURIComponent(parts[1])) : newsIndex(); }
  if (parts[0] === "blog") { setSoundtrack(null); return parts[1] ? blogPost(decodeURIComponent(parts[1])) : blogIndex(); }
  if (parts[0] === "magazine") { setSoundtrack(null); return magazinePage(); }
  if (parts[0] === "podcast") { setSoundtrack(null); return podcastPage(); }
  if (parts[0] === "mis-lecturas") { setSoundtrack(null); return myReading(); }
  if (parts[0] === "juegos") { setSoundtrack(null); return gamesHub(); }
  if (parts[0] === "game") { setSoundtrack(null); return game(); }
  if (parts[0] === "ajedrez") { setSoundtrack(null); return chessPage(); }
  if (parts[0] === "quest") { setSoundtrack(null); return questPage(); }
  if (parts[0] === "learn") { setSoundtrack(null); return parts[1] ? learnUnit(decodeURIComponent(parts[1]), parts[2] === "practice") : learnHome(); }
  let n = parts.length ? catalog.novels.find(x => x.slug === decodeURIComponent(parts[0])) : null;
  /* Скрытые романы: нет в каталоге, открываются только по прямой ссылке (novels/<slug>/novel.json) */
  if (!n && parts.length) { const sl = decodeURIComponent(parts[0]);
    if (!(sl in HIDDEN)) { HIDDEN[sl] = null; if (/^[a-z0-9-]{8,}$/.test(sl)) fetch(`novels/${sl}/novel.json`, {cache:"no-cache"}).then(r => r.ok ? r.json() : null).then(j => { if (j && j.slug === sl) { HIDDEN[sl] = j; route(); } }).catch(() => {}); }
    n = HIDDEN[sl] || null; }
  { let m = document.querySelector('meta[name="robots"]'); if (n && n.unlisted) { if (!m) { m = document.createElement("meta"); m.name = "robots"; document.head.appendChild(m); } m.content = "noindex,nofollow"; } else if (m) m.remove(); }
  setSoundtrack(n && adultOk(n) ? n : null);
  if (!parts.length) return home();
  if (!n) { app.innerHTML = `<div class="empty">${esc(t("notFound"))}</div>`; return; }
  if (!adultOk(n)) { adultGate(n); return toTop(); }
  if (parts[1] === "progreso") { progressPage(n); return toTop(); }
  if (parts[1] === "juego" && parts[2] === "moto" && n.moto) { motoPage(n); return toTop(); }
  if (parts[1] === "juego" && n.runner) { gamePage(n, parseInt(parts[2], 10)); return toTop(); }
  if (parts[1] === "boj" && n.fight) { fightPage(n, parseInt(parts[2], 10) || 1); return toTop(); }
  if (parts[1]) {
    const i = chapterIndex(n, decodeURIComponent(parts[1]));
    if (chapterLocked(n, i) && !signedIn()) { if (lang !== n.lang) setLang(n.lang); loginGate("#/" + n.slug); return toTop(); }
    if (pwLocked(n, i) && !pwOpen(n)) { if (lang !== n.lang) setLang(n.lang); pwGate(n, i); return toTop(); }
    return reader(n, i, parts[2]);
  }
  novelPage(n);
  toTop();
}

  catalog = j; route(); })

/* Glosses: **palabra**{перевод} shows the translation on hover, focus or tap */
(function(){
  let tip = null, cur = null, shownAt = 0, ptr = false;
  function show(el){
    if (!tip){ tip = document.createElement("div"); tip.id = "glossTip"; tip.setAttribute("role","tooltip"); document.body.appendChild(tip); }
    if (cur !== el) shownAt = Date.now(); cur = el; const pr = el.dataset.tr.split("|");
    const pk = el.closest("[data-pick]");
    if (pk && pr.length > 1){ const gl = pk.dataset.gl.split(","), i = Math.max(0, gl.indexOf(pk.dataset.pick)); tip.textContent = (pr[i] || pr[0]).trim(); }
    else if (pr.length > 1){ tip.innerHTML = ""; const art = el.closest("[data-gl]"), gl = art ? art.dataset.gl.split(",") : ["RU","EN","SR"];
      pr.map((v,i) => { const m = v.match(/^\s*([A-Z]{2,3}):\s*([\s\S]*)$/); return m ? [m[1], m[2]] : [gl[i] || "", v]; }).filter(([,v]) => v && v.trim()).forEach(([k,v]) => { const d = document.createElement("div"); const b = document.createElement("b"); b.textContent = k; d.append(b, " " + v.trim()); tip.appendChild(d); }); }
    else tip.textContent = el.dataset.tr;
    tip.classList.add("on");
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let x = r.left + r.width/2 - w/2; x = Math.max(12, Math.min(x, innerWidth - w - 12));
    let y = r.top - h - 8; if (y < 70) y = r.bottom + 8;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hide(){ if (tip) tip.classList.remove("on"); cur = null; }
  const g = e => e.target.closest && e.target.closest(".gloss");
  document.addEventListener("pointerover", e => { if (e.pointerType !== "mouse") return; const el = g(e); if (el) show(el); });
  document.addEventListener("pointerout", e => { if (e.pointerType === "mouse" && g(e) && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".gloss") === cur)) hide(); });
  document.addEventListener("pointerdown", () => { ptr = true; setTimeout(() => ptr = false, 500); }, true);
  document.addEventListener("focusin", e => { const el = g(e); if (el && !ptr) show(el); });
  document.addEventListener("focusout", e => { if (g(e)) hide(); });
  document.addEventListener("click", e => { const el = g(e); if (el){ if (cur === el && tip.classList.contains("on") && Date.now() - shownAt > 350) hide(); else show(el); } else hide(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") hide(); });
  addEventListener("scroll", hide, {passive:true});
  addEventListener("resize", hide);
})();
