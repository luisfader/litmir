<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LitFader — Robert Fader</title>
<meta name="description" content="LitFader — las novelas de Robert Fader en muchos idiomas.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8c2f2f">
<link rel="icon" type="image/png" sizes="32x32" href="app/favicon-32.png">
<link rel="apple-touch-icon" href="app/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LitFader">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --paper:#fbf8f2; --ink:#2a2420; --muted:#7a6f64; --line:#e2d8c8;
  --accent:#8c2f2f; --accent-soft:#f0e2dc; --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.07);
  --serif:"PT Serif",Georgia,serif; --display:"Cormorant Garamond","PT Serif",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --read-size:20px;
}
:root[data-theme="dark"]{
  --bg:#16130f; --paper:#1d1914; --ink:#e9e1d4; --muted:#a19584; --line:#332c24;
  --accent:#d98c7a; --accent-soft:#2c211c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="sepia"]{
  --bg:#efe2c8; --paper:#f4e9d3; --ink:#3b2f22; --muted:#7d6a52; --line:#dcc9a6;
  --accent:#8a4b20; --accent-soft:#ead7b5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#16130f; --paper:#1d1914; --ink:#e9e1d4; --muted:#a19584; --line:#332c24;
    --accent:#d98c7a; --accent-soft:#2c211c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 20px}

/* Header */
header.top{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{font-family:var(--display);font-size:24px;font-weight:600;text-decoration:none;letter-spacing:.01em;white-space:nowrap}
.brand small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500;margin-left:8px;letter-spacing:.04em;text-transform:uppercase}
.langs{display:flex;gap:2px;font-family:var(--sans);font-size:13px}
.langs .other-site{padding:6px 7px;border-radius:6px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-decoration:none;white-space:nowrap}
.langs .other-site:hover{color:var(--accent)}
.langs button{border:0;background:none;padding:6px 7px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600;letter-spacing:.04em}
.langs button[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.langs button:hover{color:var(--ink)}

main{flex:1}
footer{border-top:1px solid var(--line);color:var(--muted);font-family:var(--sans);font-size:13px;padding:24px 0;text-align:center}

/* Characters navigation */
.character-entry{display:inline-block;margin-top:20px;border:1px solid var(--line);border-radius:30px;padding:11px 23px;text-decoration:none;font-family:var(--sans);font-size:14px;color:var(--accent);background:var(--paper);transition:transform .2s,box-shadow .2s}
.rec{display:grid;grid-template-columns:110px 1fr;gap:20px;align-items:center;max-width:720px;margin:0 auto 34px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .2s}
.rec:hover{transform:translateY(-2px)}
.rec .cover{width:110px;margin:0}
.rec-k{font-family:var(--sans);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.rec h3{margin:6px 0 6px;font-size:22px}
.rec p{margin:0 0 10px;color:var(--muted);line-height:1.5}
.rec-go{font-family:var(--sans);font-size:14px;color:var(--accent)}
@media (max-width:520px){.rec{grid-template-columns:80px 1fr;gap:14px;padding:14px}.rec .cover{width:80px}.rec h3{font-size:18px}}
.character-entry:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.hero .character-entry + .character-entry{margin-left:10px}
/* Magazines */
.mag-list{max-width:820px;margin:0 auto;padding:8px 0 72px;display:flex;flex-direction:column;gap:22px}
.mag-card{display:grid;grid-template-columns:150px 1fr;gap:6px 24px;border:1px solid var(--line);border-radius:12px;padding:20px 22px;background:var(--paper);transition:transform .2s,box-shadow .2s}
.mag-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.mag-cover img{width:150px;aspect-ratio:210/297;object-fit:cover;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:block}
.mag-body{display:flex;flex-direction:column;gap:6px}
.mag-body h3{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.1;margin:0}
.mag-body .date{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.mag-body p{margin:0;color:var(--muted);line-height:1.5}
.mag-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:10px}
.mag-btn{font-family:var(--sans);font-size:14px;font-weight:600;text-decoration:none;padding:9px 16px;border-radius:999px;background:var(--accent);color:#fff;border:1px solid var(--accent)}
.mag-btn.ghost{background:transparent;color:var(--accent)}
.pod-card .mag-cover img{aspect-ratio:2/3}
.pod-audio{width:100%;margin-top:8px}
@media (max-width:520px){.mag-card{grid-template-columns:96px 1fr;gap:6px 14px;padding:14px}.mag-cover img{width:96px}.mag-body h3{font-size:21px}}
/* Blog */
.blog-list{max-width:720px;margin:0 auto;padding:8px 0 72px;display:flex;flex-direction:column;gap:22px}
.post-card{display:grid;grid-template-columns:1fr;gap:6px;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:22px 24px;background:var(--paper);transition:transform .2s,box-shadow .2s}
.post-card.has-img{grid-template-columns:140px 1fr;gap:6px 20px}
.post-card.has-img img{grid-row:1/5;width:140px;height:140px;object-fit:cover;border-radius:8px}
.post-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.post-card h3{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.15;margin:0}
.post-card .date{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.post-card p{margin:0;color:var(--muted)}
.post-card .more{font-family:var(--sans);font-size:14px;color:var(--accent)}
@media (max-width:520px){.post-card.has-img{grid-template-columns:1fr}.post-card.has-img img{grid-row:auto;width:100%;height:auto;aspect-ratio:16/9}}
article.chapter.post p{text-align:left}
article.chapter.post a{color:var(--accent)}
/* News (background political events from the novels, one paper per language) */
.np{max-width:1040px;margin:0 auto;padding:28px 0 72px}
.np-mast{text-align:center;border-bottom:3px double var(--ink);padding:6px 0 14px}
.np-kick{font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.np-name{font-family:var(--display);font-weight:600;font-size:clamp(40px,8vw,82px);line-height:1;margin:8px 0 6px;letter-spacing:-.01em}
.np-tag{font-family:var(--serif);font-style:italic;color:var(--muted);margin:0}
.np-line{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink);padding:8px 2px}
.np-sec{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.np-lead{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;padding:26px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.np-lead h2{font-family:var(--display);font-weight:600;font-size:clamp(30px,4.4vw,46px);line-height:1.05;margin:8px 0 12px}
.np-lead p{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 12px}
.np-lead:hover h2,.np-card:hover h3{color:var(--accent)}
.np-img{border-radius:4px;overflow:hidden;background:var(--accent-soft);aspect-ratio:4/3}
.np-img img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.np-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.np-card{display:flex;flex-direction:column;gap:8px;padding:22px 20px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.np-grid .np-card:not(:nth-child(3n+1)){border-left:1px solid var(--line)}
.np-card .np-img{aspect-ratio:16/10}
.np-card h3{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.12;margin:0}
.np-card p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.5}
.np-from{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:auto}
.np-from b{font-weight:600;color:var(--ink)}
.np-foot{margin-top:28px;padding:16px 18px;border:1px dashed var(--line);border-radius:10px;font-family:var(--sans);font-size:13px;color:var(--muted);text-align:center}
.np-art .np-meta{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.np-art .np-meta b{color:var(--accent)}
.np-art .np-deck{font-style:italic;color:var(--muted);font-size:1.05em;line-height:1.55;border-bottom:1px solid var(--line);padding-bottom:18px;margin:0 0 22px;text-align:left}
.np-art .np-paper{font-family:var(--display);font-weight:600;font-size:22px;text-align:center;border-bottom:3px double var(--ink);padding-bottom:8px;margin-bottom:26px}
.np-art .np-paper a{color:inherit;text-decoration:none}
.np-src{display:flex;gap:16px;align-items:center;margin:34px 0 0;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);text-decoration:none;color:inherit;font-family:var(--sans);font-size:14px}
.np-src .cover{width:62px;flex:none;margin:0}
.np-src b{display:block;font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink)}
.np-src span{color:var(--accent)}
.np-more{max-width:680px;margin:0 auto;padding:0 20px 20px}
.np-more h2{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--ink);padding-top:12px}
.np-more a{display:block;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;font-family:var(--display);font-size:20px;font-weight:600;line-height:1.2}
.np-more a small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:2px}
.np-chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 4px}
.np-chip{font-family:var(--sans);font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.np-chip:hover{border-color:var(--accent);color:var(--accent)}
.np-chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.np-src small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--muted);margin:2px 0 4px}
@media (max-width:820px){.np-grid{grid-template-columns:1fr 1fr}.np-grid .np-card:not(:nth-child(3n+1)){border-left:0}.np-grid .np-card:nth-child(2n){border-left:1px solid var(--line)}}
@media (max-width:620px){.np{padding-top:16px}.np-lead{grid-template-columns:1fr;gap:14px}.np-lead .np-img{order:-1}.np-grid{grid-template-columns:1fr}.np-grid .np-card:nth-child(2n){border-left:0}.np-card{padding:18px 4px}.np-line{justify-content:center}}
/* Home */
.hero{padding:72px 0 40px;text-align:center}
.hero .eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(44px,8vw,80px);line-height:1.02;margin:14px 0 16px}
.hero p{max-width:560px;margin:0 auto;color:var(--muted);font-size:18px}
.ornament{color:var(--accent);font-size:20px;margin:28px 0 0;letter-spacing:.5em}
.home-links{text-align:center;padding-bottom:24px}
.menu-open{cursor:pointer;font-weight:600}
.home-menu{border:1px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);padding:0;width:min(440px,calc(100% - 32px));max-height:85vh;box-shadow:var(--shadow)}
.home-menu::backdrop{background:rgba(0,0,0,.5)}
.hm-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.hm-head h2{font-family:var(--display);font-weight:500;font-size:24px;margin:0}
.hm-close{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.hm-list{display:flex;flex-direction:column;padding:8px 10px 14px}
.hm-item{display:block;text-align:left;text-decoration:none;font-family:var(--sans);font-size:15.5px;color:var(--ink);padding:13px 12px;border-radius:10px}
.hm-item:hover,.hm-item:focus-visible{background:var(--bg);color:var(--accent)}
.hm-item + .hm-item{border-top:1px solid var(--line)}
@media (max-width:620px){.home-menu{margin:auto 0 0;width:100%;max-width:100%;border-radius:18px 18px 0 0;border-bottom:0;max-height:80vh}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px;padding:24px 0 72px}
.card{text-decoration:none;display:flex;flex-direction:column;gap:12px}
.cover{aspect-ratio:2/3;border-radius:4px 10px 10px 4px;box-shadow:var(--shadow);overflow:hidden;position:relative;transition:transform .2s ease}
.card:hover .cover{transform:translateY(-4px)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.gen{display:flex;flex-direction:column;justify-content:space-between;padding:22px 18px;color:#fbf6ec}
.cover.gen::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:rgba(0,0,0,.18)}
.cover.gen .ct{font-family:var(--display);font-size:28px;line-height:1.05;font-weight:600}
.cover.gen .ca{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.card h3{font-family:var(--display);font-size:24px;font-weight:600;margin:0;line-height:1.15}
.card .meta{font-family:var(--sans);font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px}
.pill.off{opacity:.4}
html,body{overflow-anchor:none}
.stars{display:inline-flex;gap:1px;font-family:var(--sans);font-size:14px;line-height:1;letter-spacing:0;vertical-align:middle}
.stars i{font-style:normal;position:relative;color:color-mix(in srgb,var(--muted) 45%,transparent)}
.stars i.f{color:#d4a017}
.stars i.h::before{content:"★";position:absolute;left:0;top:0;width:50%;overflow:hidden;color:#d4a017}
.stars small{margin-left:5px;font-size:11px;color:var(--muted);font-weight:600}
.card .stars{margin-top:4px}
/* Personal reading progress and local favourites */
.library-heading{font-family:var(--display);font-size:30px;font-weight:600;margin:30px 0 12px}
.rbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.rbar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.rbar.sm{height:4px}
.rprog{margin:18px 0;font-family:var(--sans);font-size:13px}
.rprog-t{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;color:var(--muted)}
.rprog-t b{color:var(--fg,inherit);font-weight:600}
.mr-list{max-width:760px;margin:0 auto 60px}
.mr-row{display:grid;grid-template-columns:72px 1fr;gap:18px;align-items:center;padding:16px 0;border-top:1px solid var(--line);text-decoration:none}
.mr-row .cover{width:72px}
.mr-row .cover .ct{font-size:11px}.mr-row .cover .ca,.mr-row .badge18{display:none}
.mr-row h3{font-family:var(--display);font-size:22px;font-weight:600;margin:0 0 2px;line-height:1.15}
.mr-row small{font-family:var(--sans);color:var(--muted)}
.mr-row .rprog{margin:8px 0 0}
.by .stars{margin-left:2px}
.empty{text-align:center;color:var(--muted);padding:40px 0 80px;font-size:18px}
.view-switch{display:flex;justify-content:flex-end;gap:4px;margin:8px 0 -8px}
.view-switch button{font-family:var(--sans);font-size:12.5px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.view-switch button.on{color:var(--accent);border-color:var(--accent);background:var(--paper)}
.saga-head{font-family:var(--display);font-weight:500;font-size:26px;margin:32px 0 -8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.saga-head small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:600;vertical-align:middle}
.saga-head + .grid{padding-bottom:16px}

/* Novel page */
.novel{display:grid;grid-template-columns:260px 1fr;gap:48px;padding:48px 0 72px}
.novel .cover{max-width:260px}
.novel h1{font-family:var(--display);font-weight:500;font-size:clamp(38px,6vw,58px);line-height:1.05;margin:0 0 6px}
.novel .by{font-family:var(--sans);color:var(--muted);font-size:14px;margin-bottom:22px}
.novel .desc{font-size:18px;margin-bottom:28px;white-space:pre-line}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:14px;font-weight:600;background:var(--accent);color:#fff;text-decoration:none;padding:11px 18px;border-radius:8px;border:0;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:36px}
.share-box{margin:-24px 0 36px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-family:var(--sans);display:flex;flex-direction:column;gap:10px}
.share-box[hidden]{display:none}
.share-box small{color:var(--muted);font-size:13px}
.share-row{display:flex;gap:8px;flex-wrap:wrap}
.share-url{flex:1 1 220px;min-width:0;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.share-ok{color:var(--accent);font-size:13px;min-height:1em}
.toc h2{font-family:var(--sans);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.toc ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.toc li a{display:flex;gap:16px;padding:13px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-size:18px}
.toc li a:hover{color:var(--accent)}
.toc .n{font-family:var(--sans);color:var(--muted);font-size:13px;min-width:26px;padding-top:4px}
.toc .done .n::after{content:" ✓";color:var(--accent)}
.notice{font-family:var(--sans);font-size:14px;background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin-bottom:24px}
.notice a{color:var(--accent);font-weight:600;cursor:pointer}
.saga{margin:28px 0 0;min-width:0}
.novel > div{min-width:0}
.saga h2{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.saga .row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.saga a{flex:0 0 92px;text-decoration:none;color:inherit;font-family:var(--sans);font-size:12px;line-height:1.3}
.saga a .cover{border-radius:3px 7px 7px 3px;margin-bottom:6px}

.gl-pick{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:-24px 0 34px;font-family:var(--sans);font-size:12.5px;color:var(--muted)}

.gl-side{max-width:680px;margin:0 auto 28px;padding:0 20px;font-family:var(--sans)}
.gl-side details{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:4px 14px}

.gl-side .gl-title{display:none;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:4px 0 8px}

.donate .dn-qr img{display:block;margin:0 auto 6px;width:132px;height:132px;background:#fff;padding:8px;border-radius:8px;image-rendering:pixelated}
/* Gamebooks (n.gamebook): choices at the end of each section, endings tracked in this browser */
.chapter.gb ul{list-style:none;padding:0;margin:36px 0 0;display:grid;gap:10px}
.chapter.gb ul li{margin:0}
.chapter.gb ul a{display:block;border:1px solid var(--line);border-radius:10px;padding:14px 18px;text-decoration:none;color:var(--ink);font-family:var(--sans);font-size:.82em;line-height:1.4;transition:border-color .15s,background .15s}
.chapter.gb ul a::before{content:"→ ";color:var(--accent)}
.chapter.gb ul a:hover{border-color:var(--accent);background:rgba(127,127,127,.06)}
.wipnote div{font-family:var(--sans);font-size:14px;background:var(--accent-soft);border-radius:8px;padding:12px 14px;text-align:center}
.pill.adult{background:#b3261e;color:#fff;border-color:#b3261e}
.gate{text-align:center;padding:90px 20px;max-width:560px}
.gate h1{font-family:var(--display);font-weight:500;font-size:44px;margin:0 0 10px}
.gate p{color:var(--muted);font-size:18px;margin:0 0 28px}
.pw-form{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 14px}
.pw-form input{font:inherit;font-size:16px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:220px}
.pw-err{color:#b3261e;font-size:15px;min-height:1.4em;margin:0 0 18px}
.lock-big{font-size:44px;margin-bottom:12px}
.lock{font-size:.8em;opacity:.7}
.toc li.extra a{font-style:italic;color:var(--muted)}
.toc .note-mus{color:var(--accent);font-size:.9em;margin-left:4px;cursor:help}
.langs{flex-wrap:wrap;justify-content:flex-end}

/* ───────── Lesson / final test ───────── */
.ls{--ok:#3f8f1e;--ok-bg:#dff5cf;--ok-ink:#2f6d14;--bad:#d63a2f;--bad-bg:#ffe1dd;--bad-ink:#a8261d;--gold:#e0a82e;--sel:#3b6fb6;--sel-bg:#e3eefb;--on-ok:#fff;--on-bad:#fff;
  font-family:var(--sans);max-width:680px;margin:0 auto;padding:0 20px;position:relative}
:root[data-theme="dark"] .ls{--on-ok:#11240a;--on-bad:#2a0c09;--ok:#7cc95a;--ok-bg:#1f3318;--ok-ink:#9ee07a;--bad:#ff7a6e;--bad-bg:#3a1d1a;--bad-ink:#ff9d93;--sel:#7fb0f0;--sel-bg:#1c2a3d}
@media (prefers-color-scheme: dark){:root:not([data-theme]) .ls{--on-ok:#11240a;--on-bad:#2a0c09;--ok:#7cc95a;--ok-bg:#1f3318;--ok-ink:#9ee07a;--bad:#ff7a6e;--bad-bg:#3a1d1a;--bad-ink:#ff9d93;--sel:#7fb0f0;--sel-bg:#1c2a3d}}
.ls h1{font-family:var(--display);font-weight:600;font-size:clamp(36px,7vw,52px);line-height:1.05;margin:6px 0 10px}
.ls-intro,.ls-end{text-align:center;padding:48px 20px 80px}
.ls-kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
.ls-sub{color:var(--muted);font-size:17px;margin:0 auto 22px;max-width:460px;font-family:var(--serif)}
.ls-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.ls-chips span{border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.ls-best{font-size:14px;color:var(--muted);margin-bottom:20px}
.ls-link{display:block;width:max-content;margin:18px auto 0;color:var(--muted);font-size:14px;font-weight:600;text-decoration:none}
.ls-link:hover{color:var(--accent)}
.ls-mascot{width:120px;height:140px;margin:0 auto 6px}
.ls-mascot .tulip{width:100%;height:100%;filter:drop-shadow(0 8px 10px rgba(120,30,20,.18))}
.bounce .tulip{animation:lsBob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.jump .tulip{animation:lsJump .9s cubic-bezier(.3,1.6,.5,1) 3;transform-origin:50% 100%}
@keyframes lsBob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
@keyframes lsJump{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-22px) scale(1.05,.95)}100%{transform:translateY(0)}}

/* 3D chunky buttons */
.ls-btn{font:700 15px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;border-radius:16px;padding:16px 26px;cursor:pointer;border:2px solid transparent;border-bottom-width:5px;min-width:180px;transition:transform .06s,filter .15s}
.ls-btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px;margin-top:3px}
.ls-btn.go{background:var(--accent);color:#fff;border-color:color-mix(in srgb,var(--accent) 72%,#000)}
.ls-btn.go:hover:not(:disabled){filter:brightness(1.08)}
.ls-btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.ls-btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:default}

/* Play screen */
.ls-play{min-height:calc(100vh - 60px);display:flex;flex-direction:column;padding-bottom:150px}
.ls-top{display:flex;align-items:center;gap:14px;padding:22px 0 10px}
.ls-x{font-size:22px;color:var(--muted);text-decoration:none;line-height:1;padding:4px}
.ls-x:hover{color:var(--ink)}
.ls-bar{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.ls-fill{height:100%;width:0;background:var(--ok);border-radius:999px;transition:width .45s cubic-bezier(.3,1.3,.5,1);position:relative}
.ls-fill::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.ls-hearts{font-weight:800;color:var(--bad);font-size:16px;white-space:nowrap}
.ls-hearts.hit{animation:lsShake .45s}
@keyframes lsShake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.ls-snd{border:0;background:none;font-size:18px;cursor:pointer;padding:4px;opacity:.75}
.ls-stage{padding-top:18px}
.ls-stage .ls-img{margin-bottom:14px}
.ls-stage .ls-img img{max-height:180px}
.ls-stage.in{animation:lsIn .35s ease}
@keyframes lsIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.ls-img{margin:0 0 20px;text-align:center}
.ls-img img{max-width:100%;max-height:260px;border-radius:18px;border:2px solid var(--line);box-shadow:var(--shadow)}
.ls-target{color:var(--accent);white-space:nowrap}
.ls-pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.ls-opt.pic{flex-direction:column;align-items:stretch;gap:10px;padding:10px;text-align:center}
.ls-opt.pic img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#fff}
.ls-hero{position:relative;max-width:420px;margin:0 auto 18px}
.ls-hero img{width:100%;max-height:340px;object-fit:cover;object-position:50% 22%;border-radius:22px;border:2px solid var(--line);box-shadow:var(--shadow);display:block}
.ls-hero .ls-mascot{position:absolute;left:-26px;bottom:-30px;width:96px;height:112px;margin:0}
.ls-opt.pic span{display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px}
.ls-q{font-size:clamp(22px,4.5vw,28px);font-weight:800;margin:0 0 22px;color:var(--ink)}
.ls-word{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--display);font-size:clamp(38px,8vw,54px);font-weight:600;margin:6px 0 26px;color:var(--ink)}
.ls-word.es{font-family:var(--serif);font-size:clamp(28px,6vw,40px);font-style:italic}
.ls-say{width:46px;height:46px;border-radius:14px;border:0;background:var(--sel);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--sel) 65%,#000);flex:none}
.ls-say.sm{width:30px;height:30px;font-size:14px;border-radius:9px;margin-right:8px;box-shadow:0 3px 0 color-mix(in srgb,var(--sel) 65%,#000);vertical-align:2px}
.ls-say:active{transform:translateY(3px);box-shadow:none}

.ls-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ls-list{display:grid;gap:10px}
.ls-opt{display:flex;align-items:center;gap:12px;text-align:left;font:600 17px/1.3 var(--sans);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:16px;cursor:pointer;transition:background .15s,border-color .15s,transform .06s}
.ls-opt:hover:not(:disabled){background:var(--accent-soft)}
.ls-opt:active:not(:disabled){transform:translateY(2px)}
.ls-opt kbd{font:700 12px var(--sans);color:var(--muted);border:2px solid var(--line);border-radius:8px;min-width:26px;height:26px;display:inline-grid;place-items:center;flex:none}
.ls-opt.sel{border-color:var(--sel);background:var(--sel-bg);color:var(--sel)}
.ls-opt.sel kbd{border-color:var(--sel);color:var(--sel)}
.ls-opt.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink)}
.ls-opt.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink)}
.ls-opt.good kbd{border-color:var(--ok);color:var(--ok-ink)}
.ls-opt.bad kbd{border-color:var(--bad);color:var(--bad-ink)}
.ls-opt:disabled{cursor:default}

.ls-match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ls-match>div{display:grid;gap:10px}
.ls-opt.m{justify-content:center;text-align:center;padding:15px 10px}
.ls-opt.m.good{opacity:.55}
.ls-opt.m.nope{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink);animation:lsShake .4s}

.ls-bubble-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:22px}
.ls-mini{width:74px;height:86px;flex:none}
.ls-mini .tulip{width:100%;height:100%}
.ls-bubble{position:relative;border:2px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--paper);flex:1}
.ls-bubble::before{content:"";position:absolute;left:-10px;bottom:18px;width:16px;height:16px;background:var(--paper);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.ls-cz{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--ink)}
.ls-es{font-family:var(--serif);color:var(--muted);font-size:15px;margin-top:4px}
.ls-es.big{font-size:21px;color:var(--ink);margin:0}

.ls-sentence{font-family:var(--serif);font-size:22px;line-height:2.1;margin:6px 0 26px;color:var(--ink)}
.ls-blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--line);text-align:center;cursor:pointer;line-height:1.4;padding:0 6px}
.ls-blank.on{border-color:var(--sel);color:var(--sel);font-weight:700}
.ls-answer{min-height:64px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:22px;background:repeating-linear-gradient(transparent 0 58px,var(--line) 58px 60px)}
.ls-bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ls-chip{font:600 18px/1 var(--sans);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 16px;cursor:pointer}
.ls-chip:active:not(:disabled){transform:translateY(2px)}
.ls-chip.used{color:transparent;background:var(--line);border-color:var(--line);pointer-events:none}
.ls-chip.in{animation:lsPop .18s}
@keyframes lsPop{from{transform:scale(.85)}to{transform:none}}

.ls-input{width:100%;font:600 22px var(--sans);color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:16px 18px;outline:none}
.ls-input:focus{border-color:var(--sel)}
.ls-keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;justify-content:center}
.ls-key{font:600 16px var(--sans);min-width:38px;height:38px;border-radius:10px;border:2px solid var(--line);border-bottom-width:3px;background:var(--paper);color:var(--ink);cursor:pointer}

/* Footer / feedback sheet */
.ls-foot{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:var(--bg);z-index:20;transition:background .2s}
.ls-foot-in{max-width:680px;margin:0 auto;padding:18px 20px calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ls-msg{flex:1 1 240px;min-height:20px}
.ls-foot .ls-btn.go{margin-left:auto}
.ls-foot.ok{background:var(--ok-bg);border-color:transparent}
.ls-foot.ok .ls-msg{color:var(--ok-ink)}
.ls-foot.ok .ls-btn.go{color:var(--on-ok);background:var(--ok);border-color:color-mix(in srgb,var(--ok) 70%,#000)}
.ls-foot.bad{background:var(--bad-bg);border-color:transparent}
.ls-foot.bad .ls-msg{color:var(--bad-ink)}
.ls-foot.bad .ls-btn.go{color:var(--on-bad);background:var(--bad);border-color:color-mix(in srgb,var(--bad) 70%,#000)}
.ls-verdict{font-size:21px;font-weight:800;margin-bottom:4px}
.ls-msg .sol{font-size:17px;font-weight:600}
.ls-msg .tr{font-family:var(--serif);font-size:15px;opacity:.9;margin-top:3px}
.ls-streak{display:inline-block;font-size:14px;background:var(--gold);color:#fff;border-radius:999px;padding:2px 9px;vertical-align:3px;margin-left:6px}

/* End screen */
.ls-end{position:relative;overflow:hidden}
.ls-end canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ls-stats{display:flex;gap:12px;justify-content:center;margin:8px 0 28px;flex-wrap:wrap}
.ls-stat{border:2px solid;border-radius:16px;overflow:hidden;min-width:120px;text-align:center}
.ls-stat .h{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:6px 10px}
.ls-stat .v{font-size:22px;font-weight:800;padding:12px 10px;background:var(--paper);color:var(--ink)}
.ls-stat.xp{border-color:var(--gold)} .ls-stat.xp .h{background:var(--gold)}
.ls-stat.acc{border-color:var(--ok)} .ls-stat.acc .h{background:var(--ok)}
.ls-stat.tm{border-color:var(--sel)} .ls-stat.tm .h{background:var(--sel)}
.ls-end.lost h1{color:var(--bad)}

@media (max-width:560px){
  .ls-grid{grid-template-columns:1fr}
  .ls-opt{font-size:16px;padding:14px}
  .ls-msg{flex:1 1 100%}
  .ls-msg:empty{display:none}
  .ls-foot .ls-btn{flex:1 1 auto;min-width:0;padding:15px 14px}
  .ls-foot .ls-btn.ghost{flex:0 0 auto}
  .ls-foot .ls-btn.go{margin-left:0}
  .ls-mini{width:58px;height:68px}
  .ls-sentence{font-size:20px}
}
@media (prefers-reduced-motion: reduce){.ls *{animation:none!important;transition:none!important}}

@media (max-width:720px){
  .novel{grid-template-columns:1fr;gap:28px;padding-top:28px}
  .novel .cover{max-width:200px}
  .brand small{display:none}
  .brand{flex:none}
  .snav-toggle{padding:7px 6px}
  .langs{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;min-width:0;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .langs::-webkit-scrollbar{display:none}
  .grid{grid-template-columns:repeat(2,1fr);gap:18px}
  .card h3{font-size:20px}
  .cover.gen .ct{font-size:22px}
  article.chapter{padding-top:36px}
  article.chapter p{text-align:left}
}
/* Soundtrack */
.music{position:fixed;right:16px;bottom:16px;z-index:20;display:none;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 5px;box-shadow:0 6px 20px rgba(0,0,0,.12);font-family:var(--sans);font-size:13px;max-width:calc(100vw - 32px)}
.music.on{display:flex}
.music.on ~ footer{padding-bottom:76px}
.music button{border:0;background:transparent;color:var(--ink);cursor:pointer;width:32px;height:32px;border-radius:50%;font-size:14px;line-height:1;flex:none}
.music button.play{background:var(--accent);color:#fff}
.music button:hover{background:var(--accent-soft)}
.music button.play:hover{background:var(--accent)}
.music .mt{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;padding:0 2px}
.music .mt b{color:var(--ink);font-weight:600}
.music input{width:70px;accent-color:var(--accent)}
.music select{max-width:185px;min-width:125px;padding:7px 8px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:inherit;cursor:pointer}
.music .m-status{font-size:11px;color:var(--muted);max-width:185px}
.music .m-status:empty{display:none}
/* Разделы романа: саундтрек, игры, галерея */
/* Энциклопедия романа */
.cq{--cq-ink:#2b2118;--cq-mut:#7a6554;--cq-line:#ecdccb;--cq-acc:#e8546a;max-width:640px;margin:0 auto;padding:20px 16px 22px;border-radius:20px;color:var(--cq-ink);font-family:var(--sans);background:radial-gradient(110% 60% at 0% 0%,#fff1e4 0%,transparent 60%),radial-gradient(90% 60% at 100% 100%,#fde4ea 0%,transparent 60%),#fffaf5;border:1px solid var(--cq-line)}
.cq button{font:inherit;color:inherit}
.cq-hero{text-align:center}
.cq-art{width:200px;max-width:70%;height:auto;display:block;margin:0 auto 4px}
.cq-heart{transform-origin:120px 50px;animation:cqBeat 1.6s ease-in-out infinite}@keyframes cqBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(.97)}}
.cq-steam{animation:cqSteam 2.4s ease-in-out infinite;opacity:.8}@keyframes cqSteam{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(-3px);opacity:.35}}
.cq-title{font-family:var(--display);font-size:clamp(24px,5.4vw,32px);line-height:1.12;margin:4px 0 8px;color:#8c2a3c}
.cq-intro{max-width:500px;margin:0 auto;font-size:15px;line-height:1.55;color:var(--cq-mut)}
.cq-choose{text-align:center;margin:18px 0 10px;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--cq-mut)}
.cq-roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cq-role{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 12px 16px;border-radius:16px;border:2px solid var(--cq-line);background:#fff;cursor:pointer;text-align:center;transition:transform .15s,border-color .15s,box-shadow .15s}
.cq-role:hover{transform:translateY(-3px);box-shadow:0 10px 22px -14px #8c2a3c}
.cq-role-h:hover{border-color:#4a7fc2}.cq-role-m:hover{border-color:#e8546a}
.cq-ricon{font-size:44px;line-height:1}.cq-ricon.big{font-size:52px;margin-top:2px}
.cq-role b{font-size:17px}.cq-role small{font-size:13px;line-height:1.4;color:var(--cq-mut)}
.cq-role i{position:absolute;top:8px;right:10px;font-style:normal;font-size:12px;font-weight:700;color:#b07a1e}
.cq-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cq-home{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--cq-line);background:#fff;cursor:pointer}
.cq-prog{flex:1;height:8px;border-radius:8px;background:#0000000d;overflow:hidden}.cq-prog i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#f29a6b,var(--cq-acc));transition:width .3s}
.cq-of{flex:none;font-size:12.5px;font-weight:600;color:var(--cq-mut)}
.cq-scene{position:relative;height:130px;border-radius:16px;background:radial-gradient(60px 60px at 18% 30%,#ffffff70,transparent),radial-gradient(80px 80px at 85% 75%,#ffffff55,transparent),var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cq-emoji{font-size:64px;line-height:1;filter:drop-shadow(0 6px 8px #0000002a);animation:cqPop .35s ease}@keyframes cqPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.cq-place{position:absolute;left:12px;bottom:10px;padding:3px 10px;border-radius:12px;background:#ffffffcc;font-size:12.5px;font-weight:700}
.cq-q{font-size:17.5px;line-height:1.45;font-weight:600;margin:14px 2px 12px}
.cq-opts{display:flex;flex-direction:column;gap:8px}
.cq-opt{display:flex;align-items:flex-start;gap:10px;width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--cq-line);background:#fff;text-align:left;font-size:15px;line-height:1.4;cursor:pointer;transition:border-color .15s,background .15s}

.ex-ph.locked .ex-lock{position:static;background:none;font-size:18px;opacity:.7;padding:0}.ex-ph.more{background:var(--bg)}.ex-ph.more b{font:600 15px var(--sans);color:var(--ink)}.ex-ph.locked small{font:600 10px var(--sans);color:var(--muted)}

@media (max-width:720px){.ex-note{margin:0 16px 18px}}
@media (max-width:560px){.ex-games{grid-template-columns:1fr 1fr}.ex-mi{padding:11px 12px}.ex-mic{width:44px;height:44px;font-size:20px}.ex-gal{grid-template-columns:repeat(3,1fr)}}
.soundtrack-panel{margin:20px 0 24px;padding:19px 22px;border:1px solid var(--line);border-radius:15px;background:var(--paper)}

.soundtrack-site{margin:0 0 12px!important}.soundtrack-site a{color:var(--accent);font-weight:600;text-decoration:none}.soundtrack-site a:hover{text-decoration:underline}
.soundtrack-list{display:flex;flex-wrap:wrap;gap:8px}
.soundtrack-list button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 12px;cursor:pointer;text-align:left}

@media(max-width:640px){.music{left:10px;right:10px;bottom:10px;flex-wrap:wrap;border-radius:17px;max-width:none}.music .mt{display:none}.music select{flex:1;max-width:none;min-width:120px}.music .m-status{max-width:none;width:100%;padding:0 8px}.music input{width:55px}}

.reflection-option input{accent-color:var(--accent);margin-top:.4em;flex-shrink:0}

/* Novels chess (#/ajedrez) */
.cz{--sq-l:#efe2cb;--sq-d:#b98a66;--hl:rgba(214,170,60,.55);--sel:rgba(140,47,47,.45);padding-bottom:50px}
:root[data-theme="dark"] .cz{--sq-l:#cdb594;--sq-d:#86603f;--sel:rgba(217,140,122,.55)}

.cz-hide{display:none!important}
.cz-hero{padding:34px 0 6px;text-align:center}
.cz-hero h1{font-family:var(--display);font-weight:500;font-size:clamp(36px,7vw,60px);line-height:1.05;margin:8px 0 10px}
.cz-lead{max-width:640px;margin:0 auto;color:var(--muted);font-size:17px}
.cz h2{font-family:var(--display);font-weight:600;font-size:26px;margin:28px 0 12px}
.cz-armies{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cz-army{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.cz-army:hover{transform:translateY(-1px)}
.cz-army[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset,var(--shadow)}
.cz-army .cz-faces{display:flex}
.cz-army .cz-faces img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--paper);margin-right:-7px;background:var(--line)}
.cz-army b{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.1}
.cz-army small{font:12.5px var(--sans);color:var(--muted)}
.cz-army[disabled]{opacity:.38;cursor:not-allowed;transform:none}
@media (max-width:560px){.cz-armies{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.cz-army{min-width:0;padding:10px}.cz-army .cz-faces img{width:27px;height:27px;margin-right:-6px}.cz-army b{font-size:18px}.cz-army small{font-size:11.5px}}
.cz-seg{display:flex;flex-wrap:wrap;gap:8px}
.cz-seg button{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;text-align:left;min-width:120px;flex:1;cursor:pointer}
.cz-seg button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;color:var(--accent)}
.cz-seg button b{display:block;font:600 15px var(--sans)}
.cz-seg button small{display:block;font:12px var(--sans);color:var(--muted)}
.cz-cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:30px 0 20px}
.cz-btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:30px;padding:12px 26px;font:600 15px var(--sans);cursor:pointer}
:root[data-theme="dark"] .cz-btn{color:#1d1914}
@media (prefers-color-scheme: dark){:root:not([data-theme]) .cz-btn{color:#1d1914}}
.cz-btn.cz-alt{background:transparent;color:var(--accent)}
.cz-game{display:grid;grid-template-columns:minmax(0,600px) minmax(240px,1fr);gap:26px;align-items:start;padding-top:18px}
@media (max-width:860px){.cz-game{grid-template-columns:1fr;gap:16px;padding-top:10px}}
.cz-side{display:flex;align-items:center;gap:10px;min-height:52px;font-family:var(--sans)}
.cz-who{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.cz-who img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.cz-who div{min-width:0}
.cz-who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cz-who span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cz-caps{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;max-width:55%}
.cz-caps img{width:20px;height:20px;border-radius:50%;object-fit:cover;margin-left:-5px;border:1.5px solid var(--bg)}
.cz-caps em{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
.cz-think{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;animation:czpulse 1s infinite ease-in-out;vertical-align:middle}
@keyframes czpulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.cz-board{position:relative;width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.cz-sq{position:relative;border:0;padding:0;margin:0;background:var(--sq-l);display:grid;place-items:center;cursor:pointer}
.cz-sq.d{background:var(--sq-d)}
.cz-sq.last::before{content:"";position:absolute;inset:0;background:var(--hl)}
.cz-sq.sel::before{content:"";position:absolute;inset:0;background:var(--sel)}
.cz-sq.hint::before{content:"";position:absolute;inset:0;background:rgba(70,150,110,.55)}
.cz-sq.chk::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(circle,rgba(225,25,25,1) 0%,rgba(225,25,25,.9) 55%,rgba(225,25,25,0) 74%)}
.cz-sq.chk .cz-pc{animation:czchk 1.2s ease-in-out 2;box-shadow:0 0 0 2.5px #e11919,0 0 12px 3px rgba(225,25,25,.9)}
@keyframes czchk{50%{transform:scale(1.08)}}
.cz-dot{position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(40,25,15,.32);z-index:3;pointer-events:none}
.cz-ring{position:absolute;inset:3%;border-radius:50%;border:4px solid rgba(40,25,15,.35);z-index:3;pointer-events:none}
.cz-co{position:absolute;font:600 9px var(--sans);opacity:.7;pointer-events:none;z-index:1}
.cz-co.f{right:3px;bottom:1px} .cz-co.r{left:3px;top:1px}
.cz-sq.d .cz-co{color:var(--sq-l)} .cz-sq:not(.d) .cz-co{color:var(--sq-d)}
.cz-pc{position:relative;z-index:2;display:block;width:84%;height:84%;border-radius:50%;background-size:cover;background-position:center;pointer-events:none;will-change:transform}
.cz-pc.w{box-shadow:0 0 0 2.5px #fffaf0,0 0 0 4px rgba(40,25,15,.55),0 3px 6px rgba(0,0,0,.35)}
.cz-pc.b{box-shadow:0 0 0 2.5px #1b1512,0 0 0 4px rgba(255,245,230,.6),0 3px 6px rgba(0,0,0,.4)}
.cz-pc.k,.cz-pc.q{width:90%;height:90%} .cz-pc.p{width:72%;height:72%}
.cz-pc i{position:absolute;right:-9%;bottom:-9%;width:44%;height:44%;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:clamp(9px,2.6vw,16px);line-height:1;font-family:"Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols 2",serif}
.cz-pc.w i{background:#fffaf0;color:#2a2420;box-shadow:0 0 0 1.5px rgba(40,25,15,.55)}
.cz-pc.b i{background:#1b1512;color:#f5eadb;box-shadow:0 0 0 1.5px rgba(255,245,230,.6)}
.cz-pc.p i{width:50%;height:50%}
.cz-drag{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.12)}
.cz-status{font-family:var(--sans);font-size:15px;text-align:center;min-height:24px;margin:10px 0 2px;font-weight:500}
.cz-status.end{color:var(--accent);font-weight:600}
.cz-selinfo{font:13px var(--sans);color:var(--muted);text-align:center;min-height:20px}
.cz-tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.cz-tools button{border:1px solid var(--line);background:var(--paper);border-radius:30px;padding:9px 15px;font:500 14px var(--sans);cursor:pointer}
.cz-tools button:disabled{opacity:.4;cursor:default}
.cz-tools button.warn{border-color:var(--accent);color:var(--accent)}
.cz-end{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.cz-panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.cz-panel h3{font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.cz-moves{font:14px var(--sans);display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 8px;max-height:260px;overflow:auto}
.cz-moves span:nth-child(3n+1){color:var(--muted)}
.cz-moves .cur{color:var(--accent);font-weight:600}
.cz-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font:13px var(--sans)}
.cz-legend h4{grid-column:1/-1;margin:6px 0 0;font:600 18px var(--display)}
.cz-legend div{display:flex;align-items:center;gap:8px;min-width:0}
.cz-legend img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.cz-legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cz-legend small{color:var(--muted)}
.cz-modal{position:fixed;inset:0;z-index:60;background:rgba(20,14,10,.55);display:grid;place-items:center;padding:18px}
.cz-modal .cz-card{background:var(--paper);border-radius:16px;padding:20px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow)}
.cz-modal h3{font-family:var(--display);font-size:24px;margin:0 0 14px;font-weight:600}
.cz-promo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cz-promo button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 4px;font:12px var(--sans);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}

/* Menú lateral */
.brandbox{display:flex;align-items:center;gap:4px;flex:none}
.gh{max-width:900px;margin:0 auto 60px}

.snav-toggle{border:0;background:none;font-size:21px;line-height:1;cursor:pointer;padding:7px 9px;border-radius:9px;color:var(--ink);flex:none}
.snav-toggle:hover,.snav-toggle[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
.snav{position:fixed;top:61px;left:0;bottom:0;width:240px;z-index:9;background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;padding:16px 10px 90px;font-family:var(--sans);transform:translateX(-100%);visibility:hidden;transition:transform .22s ease,visibility .22s}

}

}

<script>
/* App instalable (PWA): botón «Instalar app» y funcionamiento sin conexión. */
(function(){
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  const box = document.getElementById("install");
  if (!box || matchMedia("(display-mode: standalone)").matches || navigator.standalone) return;
  const TX = {
    es:["Instalar app","Para instalar: toca Compartir y luego «Añadir a pantalla de inicio»."],
    ru:["Установить приложение","Чтобы установить: нажмите «Поделиться» и «На экран Домой»."],
    it:["Installa l'app","Per installare: tocca Condividi e poi «Aggiungi alla schermata Home»."],
    en:["Install app","To install: tap Share, then “Add to Home Screen”."],
    fr:["Installer l'app","Pour installer : touchez Partager puis « Sur l'écran d'accueil »."],
    pt:["Instalar app","Para instalar: toque em Partilhar e depois «Adicionar ao ecrã principal»."],
    tr:["Uygulamayı yükle","Yüklemek için: Paylaş'a, sonra «Ana Ekrana Ekle»'ye dokunun."]
  };
  const tx = () => TX[document.documentElement.lang] || TX.en;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let evt = null;
  function draw(){
    if (!evt && !ios) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = evt ? `<button type="button">📲 ${tx()[0]}</button>` : `<p>📲 ${tx()[1]}</p>`;
  }
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); evt = e; draw(); });
  addEventListener("appinstalled", () => { evt = null; box.hidden = true; });
  box.addEventListener("click", async e => {
    if (!evt || !e.target.closest("button")) return;
    evt.prompt(); await evt.userChoice.catch(() => {}); evt = null; draw();
  });
  new MutationObserver(draw).observe(document.documentElement, {attributes:true, attributeFilter:["lang"]});
  draw();
})();

/* Reader reflection panel for Предчувствие: literary discussion, never language drills. */
function setupPredchuvstvieReflection(root) {
  const article = root.querySelector("article.chapter");
  if (!article) return;
  const key = "predchuvstvie:reflection:v1";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(key) || "{}"); } catch (_) {}
  const save = () => { try { localStorage.setItem(key, JSON.stringify(saved)); } catch (_) {} };
  const answers = {17:true,18:false,19:true,20:true,21:false,22:true,23:false,24:true,25:false,26:true,27:true,28:true,29:false,30:false};
  const result = document.createElement("section");
  result.className = "reflection-result";
  result.innerHTML = '<h2>Ваши ответы</h2><p class="reflection-status" role="status" aria-live="polite">Выберите варианты. Ваши ответы сохраняются только в этом браузере.</p><button type="button" class="btn reflection-check">Проверить факты сюжета</button> <button type="button" class="btn ghost reflection-reset">Начать заново</button>';
  const profiles = [
    {title:"Идеалист",description:"В ваших ответах заметна вера в ценность надежды, человеческого достоинства и взаимной поддержки. Вам близка мечта Роберта о мире, который можно построить заново."},
    {title:"Прагматик",description:"Вы склонны замечать последствия решений, необходимость защиты и сложность компромиссов. Для вас важно не только провозгласить идеал, но и сохранить его в опасном мире."},
    {title:"Бунтарь",description:"Вы особенно остро воспринимаете давление власти и толпы. Вас привлекают свобода выбора, право сомневаться и способность противостоять навязанным правилам."},
    {title:"Наблюдатель",description:"Вы видите противоречия персонажей и не спешите делить их на героев и злодеев. Вам важнее понять скрытые мотивы, чем выбрать безусловно правую сторону."}
  ];
  const profilePanel=document.createElement("section");
  profilePanel.className="reflection-result reflection-profile";
  profilePanel.innerHTML='<h2>Кем вы могли бы стать в «Нашей Утопии»?</h2><p class="reflection-profile-text" role="status" aria-live="polite"></p><p><small>Это литературная интерпретация ответов, а не психологический тест или диагноз. Ни один тип не лучше другого.</small></p><button type="button" class="btn reflection-profile-button">Узнать свой образ</button>';
  function updateProfile(show=false) {
    const el=profilePanel.querySelector(".reflection-profile-text");
    const selected=Array.from({length:16},(_,i)=>saved[i+1]).filter(v=>/^[0-3]$/.test(v||""));
    if(selected.length<12){el.textContent="Ответьте хотя бы на 12 из 16 философских и психологических вопросов. Сейчас: "+selected.length+" из 16.";return;}
    if(!show && !profilePanel.dataset.shown){el.textContent="Образ готов. Нажмите «Узнать свой образ».";return;}
    const counts=[0,0,0,0];
    // Each response reflects a *literary* reading style, not a clinical trait.
    const mapping=[
      [0,1,3,3],[1,2,3,0],[0,2,1,3],[0,1,2,3],
      [0,3,1,1],[2,3,0,3],[1,2,0,3],[0,3,1,2],
      [0,2,1,3],[2,1,0,3],[1,2,1,0],[1,0,1,3],
      [3,2,2,1],[0,0,2,2],[0,1,3,3],[0,3,3,1]
    ];
    for(let i=0;i<16;i++) if(/^[0-3]$/.test(saved[i+1]||"")) counts[mapping[i][Number(saved[i+1])]]++;
    const best=Math.max(...counts), ties=counts.map((v,i)=>v===best?i:-1).filter(i=>i>=0);
    const p=profiles[ties[0]]; const second=counts.map((v,i)=>({v,i})).filter(x=>x.i!==ties[0]).sort((a,b)=>b.v-a.v)[0];
    el.textContent=p.title+" — "+p.description+(ties.length>1?" В ваших ответах также заметны черты образа «"+profiles[ties[1]].title+"».":second.v>=best-2?" Вам также близок образ «"+profiles[second.i].title+"».":"");
    profilePanel.dataset.shown="1";
  }
  profilePanel.querySelector(".reflection-profile-button").onclick=()=>updateProfile(true);
  const qNodes = [...article.querySelectorAll("p")].filter(p => /^\s*(?:\*\*)?(?:[1-9]|[12][0-9]|30)\.\s/.test(p.textContent));
  let found = 0;
  qNodes.forEach(p => {
    const match = p.textContent.match(/^\s*(\d+)\.\s/);
    if (!match) return;
    const num = Number(match[1]);
    if (num < 1 || num > 30) return;
    const next = p.nextElementSibling;
    if (!next) return;
    const group = document.createElement("fieldset");
    group.className = "reflection-card";
    const title = document.createElement("legend");
    title.textContent = p.textContent.replace(/^\s*\d+\.\s*/, "");
    group.appendChild(title);
    if (num <= 16 && next.tagName === "UL") {
      [...next.querySelectorAll(":scope > li")].forEach((li, i) => {
        const label = document.createElement("label");
        label.className = "reflection-option";
        const input = document.createElement("input");
        input.type = "radio"; input.name = "reflection-" + num; input.value = String(i);
        input.checked = saved[num] === String(i);
        input.onchange = () => { saved[num] = input.value; save(); updateProfile(); };
        label.append(input, document.createTextNode(" " + li.textContent));
        group.appendChild(label);
      });
      next.replaceWith(group); p.remove(); found++;
    } else if (num >= 17 && num <= 30 && next.tagName === "P" && /Правда/.test(next.textContent) && /Ложь/.test(next.textContent)) {
      [["true","Правда"],["false","Ложь"]].forEach(([val,word]) => {
        const label = document.createElement("label");
        label.className = "reflection-option";
        const input = document.createElement("input");
        input.type = "radio"; input.name = "reflection-" + num; input.value = val;
        input.checked = saved[num] === val;
        input.onchange = () => { saved[num] = val; save(); group.classList.remove("reflection-correct","reflection-incorrect"); };
        label.append(input,document.createTextNode(" " + word)); group.appendChild(label);
      });
      next.replaceWith(group);p.remove();found++;
    }
    group.dataset.question = num;
  });
  if (!found) return;
  const h = document.createElement("p");
  h.className = "reflection-intro";
  h.textContent = "Выберите один вариант в каждом вопросе. В первых двух разделах нет правильных или неправильных решений: важна ваша интерпретация.";
  article.insertBefore(h,article.querySelector("h2") || article.firstChild);
  const details = [...article.querySelectorAll("details")];
  if (details.length) details[0].open = false;
  const ending = document.createElement("section");
  ending.className="reflection-ending";
  ending.appendChild(profilePanel);
  ending.appendChild(result);
  updateProfile();
  article.appendChild(ending);
  result.querySelector(".reflection-check").onclick = () => {
    let correct=0, done=0;
    for(const [n,expected] of Object.entries(answers)){
      const card=article.querySelector('[data-question="'+n+'"]');
      if (!card) continue;
      const val=saved[n];
      card.classList.remove("reflection-correct","reflection-incorrect");
      if(val==="true"||val==="false"){
        done++;
        const ok=(val==="true")===expected;
        if(ok)correct++;
        card.classList.add(ok?"reflection-correct":"reflection-incorrect");
      }
    }
    result.querySelector(".reflection-status").textContent="Проверено: "+done+" из 14. Верных ответов: "+correct+". Ошибки выделены, а пояснения находятся в раскрывающемся ключе выше.";
    result.scrollIntoView({behavior:"smooth",block:"center"});
  };
  result.querySelector(".reflection-reset").onclick = () => {
    saved={};save();delete profilePanel.dataset.shown;updateProfile();
    article.querySelectorAll(".reflection-card input").forEach(x=>x.checked=false);
    article.querySelectorAll(".reflection-card").forEach(x=>x.classList.remove("reflection-correct","reflection-incorrect"));
    result.querySelector(".reflection-status").textContent="Ответы очищены. Вы можете пройти вопросы ещё раз.";
  };
}

function renderText(md){

    if (gm) { const items = b.split("\n").slice(1).map(r => r.trim().match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/)).filter(Boolean);

    let m = b.match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/);
    /* ![m|Подпись](src) — картинка среднего размера с подписью; ![w|Подпись](src) — широкая с подписью */
    const mcap = m && m[1].match(/^([mw])\|(.+)$/);
    if (mcap) return `<figure class="${mcap[1] === "m" ? "mid" : "wide"} cap"><img src="${esc(m[2])}" alt="${esc(mcap[2])}" loading="lazy"><figcaption>${inline(mcap[2])}</figcaption></figure>`;
    if (m) return m[1] === "m" ? `<figure class="mid"><img src="${esc(m[2])}" alt="" loading="lazy"></figure>` : `<figure><img src="${esc(m[2])}" alt="${esc(m[1])}" loading="lazy"></figure>`;
    if (/^##\s/.test(b)) return "<h2>" + inline(b.replace(/^#+\s*/,"")) + "</h2>";

      return '<div class="tbl"><table>' + rows.map((r,i) => "<tr>" + r.map(c => i ? "<td>"+c+"</td>" : "<th>"+c+"</th>").join("") + "</tr>").join("") + "</table></div>"; }

    if (/^>/.test(b)) return "<blockquote><p>" + inline(b.replace(/^>\s?/gm,"")).replace(/\n/g,"<br>") + "</p></blockquote>";
    const psy = b.match(/^([\s\S]*?)\s*\[\[@([A-Z])\s+([^|\]]+)\|@([A-Z])\s+([^\]]+)\]\]\s*$/);
    if (psy) return `<div class="psy"><p class="psyq">${inline(psy[1])}</p><div class="psyb"><button type="button" data-k="${psy[2]}" aria-pressed="false">${inline(psy[3].trim())}</button><button type="button" data-k="${psy[4]}" aria-pressed="false">${inline(psy[5].trim())}</button></div></div>`;

    if (tx) { const alts = tx[2].split("|").map(w => w.trim()).filter(Boolean);

const EX_T = {it:["Tocca le parole nell'ordine giusto","Scrivi qui…","Risposta giusta:"], es:["Toca las palabras en el orden correcto","Escribe aquí…","Respuesta correcta:"], en:["Tap the words in the right order","Type here…","Correct answer:"], ru:["Нажимай на слова в правильном порядке","Пиши здесь…","Правильный ответ:"], pt:["Toque as palavras na ordem certa","Escreva aqui…","Resposta certa:"], fr:["Touche les mots dans le bon ordre","Écris ici…","Bonne réponse :"], de:["Tippe die Wörter in der richtigen Reihenfolge","Hier schreiben…","Richtige Antwort:"]};
const exNorm = v => String(v || "").normalize("NFC").toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,!?¿¡«»"“”„—–…;:()]/g," ").replace(/\s+/g," ").trim();
const exBare = v => exNorm(v).normalize("NFD").replace(/[̀-ͯ]/g,"");
function exRight(p){
  if (!p.dataset.alts) return p.dataset.sel === p.dataset.a ? 1 : 0;
  const v = p.dataset.sel || "", alts = p.dataset.alts.split("|");
  if (!exNorm(v)) return 0;
  if (alts.some(a => exNorm(a) === exNorm(v))) return 1;
  return p.classList.contains("tx") && alts.some(a => exBare(a) === exBare(v)) ? 0.5 : 0;
}
function exMark(p, r, label){
  p.classList.toggle("ok", r > 0); p.classList.toggle("bad", r === 0);
  let f = p.querySelector(".exfix");
  if (p.dataset.alts && r < 1){ if (!f){ f = document.createElement("div"); f.className = "exfix"; p.appendChild(f); } f.innerHTML = esc(label) + " <b>" + esc(p.dataset.alts.split("|")[0]) + "</b>"; }
  else if (f) f.remove();
}
function exUnmark(p){ p.classList.remove("ok","bad"); const f = p.querySelector(".exfix"); if (f) f.remove(); }
function exClear(p){
  delete p.dataset.sel; exUnmark(p);
  p.querySelectorAll("button[data-v]").forEach(x => x.setAttribute("aria-pressed","false"));
  const sel = p.querySelector("select"); if (sel) sel.selectedIndex = 0;
  const inp = p.querySelector("input"); if (inp) inp.value = "";
  const bank = p.querySelector(".bdbank");
  if (bank) [...p.querySelectorAll(".bdt")].sort((a,b) => a.dataset.i - b.dataset.i).forEach(t => bank.appendChild(t));
}
function exBind(p, changed, enter){
  p.querySelectorAll("button[data-v]").forEach(b => b.onclick = () => {
    changed(); p.dataset.sel = b.dataset.v;
    p.querySelectorAll("button[data-v]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  const sel = p.querySelector("select"); if (sel) sel.onchange = () => { changed(); p.dataset.sel = sel.value; };
  const inp = p.querySelector("input");
  if (inp){ inp.oninput = () => { changed(); p.dataset.sel = inp.value; }; inp.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); enter(); } }; }
  const line = p.querySelector(".bdline"), bank = p.querySelector(".bdbank");
  if (line && bank) p.onclick = e => {
    const t = e.target.closest(".bdt"); if (!t || t.disabled) return;
    changed();
    if (t.parentNode === bank) line.appendChild(t);
    else { const after = [...bank.children].find(x => +x.dataset.i > +t.dataset.i); bank.insertBefore(t, after || null); }
    p.dataset.sel = [...line.children].map(x => x.textContent).join(" ");
  };
}
function setupQuizzes(root, lang){
  const T = QUIZ_T[lang] || QUIZ_T.es;
  const items = [...root.querySelectorAll("p.vf, p.mc, div.bd, div.tx")];
  const EX = EX_T[lang] || EX_T.en;
  root.querySelectorAll("div.bd .bdline").forEach(l => l.dataset.ph = EX[0]);
  root.querySelectorAll("div.tx input").forEach(i => { i.placeholder = EX[1]; if (lang) i.lang = lang; });
  const PICK = {es:"— elige —", it:"— scegli —", en:"— choose —", ru:"— выбери —", pt:"— escolha —", fr:"— choisis —", de:"— wähle —", cs:"— vyber —", pl:"— wybierz —", sr:"— изабери —", bg:"— избери —", eo:"— elektu —", tr:"— seç —", ia:"— elige —", isv:"— izberi —", la:"— elige —", sw:"— chagua —", vec:"— sièlzi —"};
  root.querySelectorAll("p.mc select").forEach(sel => { if (sel.options[0]) sel.options[0].textContent = PICK[lang] || PICK.es; });
  if (lang === "en") root.querySelectorAll('p.vf button[data-v="V"]').forEach(b => b.textContent = "T");
  if (lang === "cs") root.querySelectorAll("p.vf button[data-v]").forEach(b => { b.textContent = b.dataset.v === "V" ? "Pravda" : "Lež"; });
  if (lang === "ru") root.querySelectorAll("p.vf button[data-v]").forEach(b => { b.textContent = b.dataset.v === "V" ? "Да" : "Нет"; b.title = b.dataset.v === "V" ? "Верно" : "Неверно"; });
  const isModule = !!root.querySelector("article.chapter") && /^(?:modulo-[1-4]|test-final)[.]md$/.test(window.__activeChapterFile || "");
  if (isModule && items.length) {
    const chapter = root.querySelector("article.chapter");
    const key = "module-best:el-tren-fantasma:" + window.__activeChapterFile;
    const finalExam = window.__activeChapterFile === "test-final.md";
    const box = document.createElement("section");
    box.className = "module-score";
    box.style.cssText = "max-width:720px;margin:2em auto;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--accent-soft);text-align:center";
    box.innerHTML = '<h2 style="margin:.1em 0 .6em">' + (finalExam ? 'Evaluación final de la novela' : 'Evaluación del módulo') + '</h2><p class="module-best"></p><button type="button" class="btn module-grade">Calificar módulo</button><button type="button" class="btn ghost module-retry" style="margin-left:10px" hidden>Repetir examen</button><p class="module-result" role="status" aria-live="polite"></p><p><a href="#/el-tren-fantasma/progreso">Ver mi progreso completo →</a></p>';
    chapter.appendChild(box);
    const bestEl = box.querySelector(".module-best"), result = box.querySelector(".module-result");
    const grade = box.querySelector(".module-grade"), retry = box.querySelector(".module-retry");
    const best = () => { const v = store.get(key, null); bestEl.textContent = v === null ? "Todavía no hay una calificación guardada." : "Mejor nota: " + v + " / 100"; };
    best();
    items.forEach(p => exBind(p, () => exUnmark(p), () => {}));
    grade.onclick = () => {
      const answered = items.filter(p => p.dataset.sel !== undefined && p.dataset.sel !== "").length;
      if (answered < items.length) { result.textContent = "Respondé todas las preguntas antes de calificar (" + answered + " de " + items.length + ")."; return; }
      const correct = items.reduce((count,p) => {
        const r = exRight(p); exMark(p, r, EX[2]);
        return count + (r ? 1 : 0);
      }, 0);
      const score = Math.round(100 * correct / items.length);
      const previous = store.get(key, null);
      if (previous === null || score > previous) store.set(key, score);
      best();
      result.textContent = "Resultado: " + score + " / 100 · " + correct + " de " + items.length + " respuestas correctas." + (finalExam ? (score >= 70 ? " ¡Aprobado!" : " Necesitás 70 puntos para aprobar.") : "");
      grade.hidden = true; retry.hidden = false;
      items.forEach(p => { p.querySelectorAll("button,select,input").forEach(el => el.disabled = true); });
    };
    retry.onclick = () => {
      items.forEach(p => { exClear(p); p.querySelectorAll("button,select,input").forEach(el => el.disabled = false); });
      result.textContent = ""; grade.hidden = false; retry.hidden = true;
      box.scrollIntoView({behavior:"smooth",block:"nearest"});
    };
    return;
  }
  const groups = [];
  items.forEach(p => { const prev = p.previousElementSibling; if (prev && prev.matches("p.vf, p.mc, div.bd, div.tx") && groups.length) groups[groups.length-1].push(p); else groups.push([p]); });
  groups.forEach(g => {
    const bar = document.createElement("div"); bar.className = "vfcheck";
    bar.innerHTML = `<button type="button" class="vfgo">${T[0]}</button><span class="vfres" aria-live="polite"></span>`;
    g[g.length-1].after(bar);
    const res = bar.querySelector(".vfres"), go = bar.querySelector(".vfgo");
    let checked = false;
    const reset = () => { checked = false; g.forEach(exUnmark); res.textContent = ""; go.textContent = T[0]; };
    g.forEach(p => exBind(p, () => { if (checked) reset(); }, () => { if (!checked) go.click(); }));
    go.onclick = () => {
      if (checked) { g.forEach(exClear); reset(); return; }
      let ok = 0;
      g.forEach(p => { const r = exRight(p); if (r) ok++; exMark(p, r, EX[2]); });
      res.textContent = `${ok} / ${g.length} ${T[1]}`; go.textContent = T[2]; checked = true;
    };
  });
}

/* Drag-and-drop exercises (blocks ":::arrastrar" and ":::unir").
   :::arrastrar — each line is a sentence with gaps [[word]]; optional line "+ extra, extra" adds distractors to the bank.
   :::unir — each line "term = definition": drag the term onto its definition.
   Works with the mouse (drag and drop) and with taps (tap a word, then tap the gap). */
const DD_T = {es:["Arrastra cada palabra a su lugar. También puedes tocar una palabra y después el hueco.","Arrastra cada palabra hasta su definición. También puedes tocar una palabra y después la definición.","Comprobar","correctas","Corregir los errores","¡Perfecto!"],
  it:["Trascina ogni parola al suo posto (oppure tocca la parola e poi lo spazio).","Trascina ogni parola sulla sua definizione.","Verifica","corrette","Correggi gli errori","Perfetto!"],
  en:["Drag each word into place (or tap a word, then the gap).","Drag each word onto its definition.","Check","correct","Fix the mistakes","Perfect!"],
  ru:["Перетащите слова на место (или нажмите на слово, а потом на пропуск).","Перетащите слово к его определению.","Проверить","правильно","Исправить ошибки","Отлично!"]};
function ddHTML(kind, body){
  const lines = body.split("\n").map(s => s.trim()).filter(s => s && s !== ":::");
  const extra = [], rows = [], words = [];
  lines.forEach(l => {
    if (/^\+\s*/.test(l)) { extra.push(...l.replace(/^\+\s*/, "").split(",").map(s => s.trim()).filter(Boolean)); return; }
    if (kind === "unir") { const m = l.match(/^(.+?)\s+=\s+(.+)$/); if (!m) return; words.push(m[1].trim());
      rows.push(`<div class="ddrow"><span class="dds" role="button" tabindex="0" data-a="${esc(m[1].trim())}"></span><span class="dddef">${inline(m[2].trim())}</span></div>`); return; }
    let html = "", last = 0; const re = /\[\[([^\]]+)\]\]/g; let m;
    while ((m = re.exec(l))) { html += inline(l.slice(last, m.index)) + `<span class="dds" role="button" tabindex="0" data-a="${esc(m[1].trim())}"></span>`; words.push(m[1].trim()); last = re.lastIndex; }
    rows.push(`<p class="ddline">${html + inline(l.slice(last))}</p>`);
  });
  const bank = [...words, ...extra];
  for (let i = bank.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bank[i], bank[j]] = [bank[j], bank[i]]; }
  return `<div class="dd dd-${kind}"><p class="ddhint"></p><div class="ddbank">${bank.map((w, i) => `<button type="button" class="ddc" draggable="true" data-id="${i}">${esc(w)}</button>`).join("")}</div><div class="ddbody">${rows.join("")}</div><div class="vfcheck"><button type="button" class="vfgo"></button><span class="vfres" aria-live="polite"></span></div></div>`;
}
function setupDD(root, lang){
  const T = DD_T[lang] || DD_T.es, nm = s => String(s).normalize("NFC").toLowerCase().trim();
  root.querySelectorAll("div.dd").forEach(box => {
    const bank = box.querySelector(".ddbank"), go = box.querySelector(".vfgo"), res = box.querySelector(".vfres");
    const slots = [...box.querySelectorAll(".dds")];
    box.querySelector(".ddhint").textContent = box.classList.contains("dd-unir") ? T[1] : T[0];
    go.textContent = T[2];
    let picked = null, armed = null, checked = false;
    const clearMarks = () => { if (!checked) return; checked = false; slots.forEach(s => s.classList.remove("ok", "bad")); box.classList.remove("done"); res.textContent = ""; go.textContent = T[2]; };
    const pick = c => { if (picked) picked.classList.remove("on"); picked = c && c !== picked ? c : null; if (picked) picked.classList.add("on"); };
    const arm = s => { if (armed) armed.classList.remove("armed"); armed = s && s !== armed ? s : null; if (armed) armed.classList.add("armed"); };
    const toBank = c => { const after = [...bank.children].find(x => +x.dataset.id > +c.dataset.id); bank.insertBefore(c, after || null); };
    const place = (c, s) => { clearMarks(); const old = s.querySelector(".ddc"); if (old && old !== c) toBank(old); s.appendChild(c); c.classList.remove("on"); picked = null; arm(null); };
    box.addEventListener("click", e => {
      const c = e.target.closest(".ddc"), s = e.target.closest(".dds");
      if (c && c.parentNode === bank) { if (armed) place(c, armed); else pick(c); return; }
      if (s) { if (picked) { place(picked, s); return; } const inside = s.querySelector(".ddc"); if (inside) { clearMarks(); toBank(inside); return; } arm(s); }
    });
    box.addEventListener("keydown", e => { const s = e.target.closest(".dds"); if (s && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); s.click(); } });
    let dragged = null;
    box.addEventListener("dragstart", e => { const c = e.target.closest(".ddc"); if (!c) return; dragged = c; c.classList.add("drag"); try { e.dataTransfer.setData("text/plain", c.textContent); e.dataTransfer.effectAllowed = "move"; } catch(x) {} });
    box.addEventListener("dragend", () => { if (dragged) dragged.classList.remove("drag"); dragged = null; box.querySelectorAll(".over").forEach(x => x.classList.remove("over")); });
    box.addEventListener("dragover", e => { if (!dragged) return; const t = e.target.closest(".dds, .ddbank"); if (!t) return; e.preventDefault(); box.querySelectorAll(".over").forEach(x => x !== t && x.classList.remove("over")); t.classList.add("over"); });
    box.addEventListener("dragleave", e => { const t = e.target.closest(".dds, .ddbank"); if (t && !t.contains(e.relatedTarget)) t.classList.remove("over"); });
    box.addEventListener("drop", e => { if (!dragged) return; const t = e.target.closest(".dds, .ddbank"); if (!t) return; e.preventDefault(); t.classList.remove("over");
      if (t.classList.contains("ddbank")) { clearMarks(); toBank(dragged); } else place(dragged, t); });
    go.onclick = () => {
      if (checked) { slots.forEach(s => { if (s.classList.contains("bad")) { const c = s.querySelector(".ddc"); if (c) toBank(c); } }); clearMarks(); return; }
      let ok = 0;
      slots.forEach(s => { const c = s.querySelector(".ddc"), r = !!c && nm(c.textContent) === nm(s.dataset.a); s.classList.toggle("ok", r); s.classList.toggle("bad", !r); if (r) ok++; });
      checked = true; const all = ok === slots.length; box.classList.toggle("done", all);
      res.textContent = `${ok} / ${slots.length} ${T[3]}` + (all ? " · " + T[5] : ""); go.textContent = all ? T[2] : T[4];
      if (all) go.disabled = true;
    };
  });
}

/* Personality test: "Вопрос [[@A вариант|@B вариант]]", results "{=A} текст" shown for the most chosen letter */
const PSY_T = {ld:["Vidi may resulta","Respondi a oli kwestas"], es:["Ver mi resultado","Responde todas las preguntas"], ru:["Узнать результат","Ответьте на все вопросы"], it:["Vedi il risultato","Rispondi a tutte le domande"], en:["See my result","Answer every question"]};
function setupPsy(root, lang){
  const qs = [...root.querySelectorAll("div.psy")];
  if (!qs.length) return;
  const T = PSY_T[lang] || PSY_T.es, results = [...root.querySelectorAll("div.psyr")];
  qs.forEach(q => q.querySelectorAll("button").forEach(b => b.onclick = () => {
    q.dataset.sel = b.dataset.k;
    q.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));
  const bar = document.createElement("div"); bar.className = "vfcheck";
  bar.innerHTML = `<button type="button" class="vfgo">${T[0]}</button><span class="vfres" aria-live="polite"></span>`;
  qs[qs.length-1].after(bar);
  const res = bar.querySelector(".vfres");
  bar.querySelector(".vfgo").onclick = () => {
    results.forEach(r => r.hidden = true);
    const done = qs.filter(q => q.dataset.sel);
    if (done.length < qs.length) { res.textContent = `${T[1]} (${done.length} / ${qs.length})`; return; }
    const count = {}; done.forEach(q => count[q.dataset.sel] = (count[q.dataset.sel] || 0) + 1);
    const win = Object.keys(count).sort((a,b) => count[b] - count[a])[0];
    res.textContent = "";
    const shown = results.filter(r => r.dataset.k === win);
    shown.forEach(r => r.hidden = false);
    if (shown[0]) shown[0].scrollIntoView({behavior:"smooth", block:"center"});
  };
}

function homeListHTML(list){
  const groups = homeSagas(list);

}

let blog = null;

  return blog.posts || [];
}

const FREE_CHAPTERS = 4, FREE_UNITS = 3;
const ENC_MARK = "LITMIR-ENC1:";
async function getText(url, n){
  const r = await fetch(url); if (!r.ok) throw new Error(r.status);

/* Novels with "lock": {"free": N, "salt": "...", "iter": ...} in catalog.json: the first N entries are open,
   the rest are encrypted (tools/proteggi.mjs) with a key derived from the author's password.
   The password itself is never stored anywhere: the browser derives the key (PBKDF2) and only keeps
   that key in localStorage, so the reader types it once. A wrong password simply fails to decrypt. */
const PW_MARK = "LITMIR-PW1:";
const PW_T = {
  vec:["Capìtolo protezù","Par lèzar vanti te serve la password. Scrivi a l’autor e domàndighe la password.","Password","Verzi","Password sbaglià. Prova ancora.","Torna indrìo"],

  en:["Protected chapter","You need the password to keep reading. Contact the author and ask for the password.","Password","Unlock","Wrong password. Try again.","Go back"],
  ru:["Защищённая глава","Чтобы читать дальше, нужен пароль. Свяжитесь с автором и попросите пароль.","Пароль","Открыть","Неверный пароль. Попробуйте ещё раз.","Вернуться"]
